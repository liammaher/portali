version: 2

# The release assets are named pvault_<version>_<os>_<arch>; the plugin's installer
# (plugin/portali/skills/portali-setup) builds those names, so keep this fixed.
project_name: pvault

builds:
  - main: ./cmd/pvault
    binary: pvault
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

release:
  github:
    owner: liammaher
    name: portali
