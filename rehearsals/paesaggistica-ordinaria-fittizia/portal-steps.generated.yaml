title: Autorizzazione paesaggistica ordinaria (art. 146 D.Lgs. 42/2004), SUE Napoli (tecnico con procura)
generated: gen.py from sue-autorizzazione-paesaggistica-ordinaria (2026-10-28) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali'
- 'On Allega documenti: the relazione paesaggistica (DPCM 12/12/2005), the drawings and the photos, signed digitally'
- 'On Allega documenti: download the portal''s procura, have the client sign it, sign it digitally (.p7m) and attach it'
- Pay the imposta di bollo (two marche da 16 €) and any diritti on pagoPA after sending
- Sign and send (Firma e invio); keep the receipt
