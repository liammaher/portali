procedure: napoli/comune/scia-alternativa-pdc
title: SCIA alternativa al permesso di costruire, SUE Napoli (tecnico con procura)
generated: gen.py from sue-segnalazione-certificata-inizio-attivita-alternativa-al-permesso-di-cost (2026-10-28) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC, b) PER PRESA VISIONE, m) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'As progettista, check every asseverazione on this page: they are yours, signed with the pratica'
- Name the direttore dei lavori (and, for works on structures, the direttore dei lavori delle strutture) before the works start
- 'On Allega documenti: the portal''s procura signed by the client and the Quadro riepilogativo (SCIA alternativa DSC), then everything signed digitally (.p7m)'
- Sign and send (Firma e invio); keep the receipt. The works may start 30 days after filing, once the assents the SCIA asks for (if any) are in; the contributo, if due, is paid as quadro g) says
