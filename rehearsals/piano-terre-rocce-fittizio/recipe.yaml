procedure: napoli/comune/piano-utilizzo-terre-rocce
title: "Trasmissione del piano di utilizzo delle terre e rocce da scavo (art. 9 DPR 120/2017), SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-trasmissione-del-piano-di-utilizzo-delle-terre-e-rocce-da-scavo-ai-sensi
operation: "Trasmissione del Piano di utilizzo delle terre e rocce da scavo ai sensi dell'art. 9 del DPR n. 120/2017 (da trasmettere almeno novanta giorni prima dell'inizio dei lavori e, in ogni caso, prima della conclusione dell'eventuale procedimento di VIA o AIA)"
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
asks:
