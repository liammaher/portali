# The SUAP's opening of a hairdresser's (acconciatore), as gen.py writes its steps file. The
# first SUAP pratica generated: crawl catalogue/F839/sections/acconciatore.json; its three own
# sections drafted from the national schema by draft.py (mod_acconciatori_estetisti_apertura)
# and used as drafted; the business's shared sections from the pizzeria walk. The business
# itself declares (`subject: impresa`): a made-up ditta individuale and its titolare.
procedure: napoli/comune/scia-acconciatore-estetista
title: "Apertura di un'attività di acconciatore, SUAP Napoli (ditta individuale)"
comune: F839
sportello: suap
crawl: acconciatore
subject: impresa
operation: Aprire l'attività di acconciatore
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  # The sector sits twice in Napoli's tree; both lead to the same pratica.
  - {screen: Scelta settore attività, tree: [{leaf: "Acconciatore, barbiere, estetista, tatuatore e piercer", nth: 1}], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività di acconciatore"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
after: [Pagamento degli oneri, Gestione degli allegati]
groups:
  extras:
    question: "Does any of this apply to the business? Tick all that do, or none."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "It's a company with other partners or administrators besides the one who declares", why: "Each files a signed antimafia statement of their own (art. 85 D.Lgs. 159/2011), not mapped yet."}
  descrizione: {default: "PROVA NON INVIARE - acconciatore {{business.denominazione}}"}
  oggetto: {question: "The pratica in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the declarations yourself: the awareness box under the PEC, the antimafia declaration, consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "On Allega documenti: the planimetria quotata and the relazione descrittiva of the premises, signed digitally (.p7m)"
  - "Sign and send (Firma e invio); keep the receipt"
# Which pratica a case is: the library's rules table (rules/suap-napoli.yaml) decides, and pre-flight
# refuses a case it gives to another pratica or that needs a pratica this one doesn't file.
rules:
  table: suap-napoli
  facts: {attivita: acconciatore_estetista, evento: apertura}
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "So far for a ditta individuale or an srl, srls, snc, sas or spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Other partners or administrators file their own antimafia statements as signed attachments (art. 85 D.Lgs. 159/2011): not mapped yet."}
