  demolizione_zona_a: {group: fatti, type: yes_no, item: 'I lavori demoliscono e ricostruiscono un edificio, o la variante cambia la sagoma, in zona A della Variante generale al PRG o della Variante occidentale?',
    how: La zona si legge nella tavola di zonizzazione del PRG di Napoli.}
  piano_planovolumetrico: {group: fatti, type: yes_no, item: 'La nuova costruzione o la ristrutturazione urbanistica è disciplinata da un piano attuativo con precise disposizioni plano-volumetriche dichiarate
      dal Comune, o (per una nuova costruzione) è in diretta esecuzione di uno strumento urbanistico generale che le contiene?'}
supports:
- value: '{{ask.fascia_cimiteriale}}'
  in:
  - 'no'
  - consentito
  else: Works not allowed in a cemetery's fascia di rispetto need a deroga, not mapped yet.
- value: '{{ask.acustica}}'
  in:
  - 'false'
  else: An acoustic impact or clima acustico report (art. 8 L. 447/1995) isn't mapped yet.
- value: '{{ask.vvf_valutazione}}'
  in:
  - 'false'
  else: A project for the Vigili del Fuoco's assessment isn't mapped yet.
- value: '{{ask.igienico_conforme}}'
  in:
  - 'true'
  else: A hygiene derogation isn't mapped yet.
- value: '{{ask.progetto_impianti}}'
  in:
  - 'false'
  else: Systems needing a project (DM 37/2008 art. 5) aren't mapped yet.
- value: '{{ask.indagini_ambientali}}'
  in:
  - 'false'
  else: Soil needing environmental investigations (or already remediated) isn't mapped yet.
- value: '{{ask.urbanizzazione}}'
  in:
  - 'true'
  else: An area without its primary urbanisation works isn't mapped yet.
- if: '{{ask.prestazione_energetica}}'
  value: '{{ask.incentivo_energetico}}'
  in:
  - art 14 c6
  - art 14 c7
  - bonus volumetrico
  else: 'With the energy filing, the permesso''s form wants one energy incentive claimed (art. 14 D.Lgs. 102/2014 or the 5% bonus): a project with none can''t be filed on it as is; ask the SUE.'
- if: '{{ask.rinnovabili}}'
  value: '{{ask.incentivo_energetico}}'
  in:
  - art 14 c6
  - art 14 c7
  - bonus volumetrico
  else: 'With the renewables obligation, the permesso''s form wants one energy incentive claimed (art. 14 D.Lgs. 102/2014 or the 5% bonus): a project with none can''t be filed on it as is; ask the SUE.'
- if: '{{ask.scia_onerosa}}'
  value: '{{ask.contributo_pagamento}}'
  in:
  - prima dei lavori
  - rateizzazione
  - in corso d'opera
  else: 'A permesso''s contributo is paid when it''s collected, in instalments or during the works: never before filing.'
