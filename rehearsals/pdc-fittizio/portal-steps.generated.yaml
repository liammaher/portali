procedure: napoli/comune/permesso-di-costruire
title: Permesso di costruire, SUE Napoli (tecnico con procura)
generated: gen.py from sue-permesso-di-costruire-art-10-d-p-r-380-2001 (2026-10-28) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- 'Tick the dichiarante''s declarations: the awareness box under the PEC, j) diritti di terzi, consapevolezza (artt. 46-47), informativa privacy, tasse comunali, art. 75 DPR 445/2000'
- 'As progettista, check every asseverazione on this page: the portal makes them the Relazione tecnica di asseverazione you sign with the request'
- 'On Allega documenti: the portal''s procura signed by the client and the Quadro riepilogativo (PdC DSC), the broadband infrastructure drawing (art. 135-bis DPR 380/2001: signed files only), the contributo''s
  prospetto or the documents for the SUE to work it out (the permesso has no slot for them: under Allegati liberi), then everything signed digitally (.p7m)'
- Pay the diritti and the bollo as the portal asks, then sign and send (Firma e invio); keep the receipt
- 'Once the permesso is issued: collect it (paying the contributo, if due, as quadro f) says), name the structural designer and the direttori dei lavori, and file the comunicazione di inizio lavori with
  the energy report and the structural filings'
