supports:
- value: '{{ask.scia_cambio_uso}}'
  in:
  - 'false'
  else: A change of use isn't mapped yet.
- value: '{{ask.paesaggio}}'
  in:
  - 'no'
  - senza autorizzazione
  else: 'A landscape authorization goes in the same pratica as the SCIA (selected with it on the SUE): that combination isn''t mapped yet.'
- value: '{{ask.fascia_cimiteriale}}'
  in:
  - 'no'
  - consentito
  else: Works not allowed in a cemetery's fascia di rispetto need a deroga, not mapped yet.
- value: '{{ask.acustica}}'
  in:
  - 'false'
  else: Acoustic obligations aren't mapped yet.
- value: '{{ask.antincendio_soggetto}}'
  in:
  - 'false'
  else: Fire-prevention obligations aren't mapped yet.
- value: '{{ask.amianto}}'
  in:
  - 'false'
  else: Works on parts with asbestos aren't mapped yet.
- value: '{{ask.igienico_conforme}}'
  in:
  - 'true'
  else: A hygiene derogation isn't mapped yet.
- value: '{{ask.barriere}}'
  in:
  - 'false'
  else: The barriers rules (artt. 77-82) aren't mapped yet.
- value: '{{ask.progetto_impianti}}'
  in:
  - 'false'
  else: Systems needing a project aren't mapped yet.
- value: '{{ask.prestazione_energetica}}'
  in:
  - 'false'
  else: Energy-performance filings aren't mapped yet.
