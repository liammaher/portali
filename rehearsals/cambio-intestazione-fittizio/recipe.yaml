# Cambio d'intestazione of a CILA, SCIA or DIA on Napoli's SUE, as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/sue-cambio-intestazione-cia-scia-dia.json). The CILA rehearsal's architect (with procura) and
# client (rehearsals/cila-fittizia).
procedure: napoli/comune/cambio-intestazione-cila-scia
title: "Cambio d'intestazione of a CILA, SCIA or DIA, SUE Napoli (tecnico con procura)"
comune: F839
sportello: sue
crawl: sue-cambio-intestazione-cia-scia-dia
operation: Cambio intestazione CIA / SCIA / DIA
scelte: [IL PRESENTATORE DELLA DOMANDA È UN PROFESSIONISTA / ALTRO SOGGETTO MUNITO DI PROCURA SPECIALE]
first: [Scheda anagrafica, Qualifica e dati del procuratore]
asks:
  descrizione: {default: "PROVA NON INVIARE - cambio intestazione {{c:identity.last_name}}"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the dichiarante's declarations: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, and the acknowledgements in the client's name"
  - "On Allega documenti: download the portal's procura, have the client sign it, sign it digitally (.p7m) and attach it"
  - "Pay the imposta di bollo (two marche da 16 €) and any diritti on pagoPA after sending"
  - "Sign and send (Firma e invio); keep the receipt"
supports:
  - when: "{{ask.bollo_marche|not}}"
    else: "So far only with the bollo paid on pagoPA: the marche route isn't run yet."
