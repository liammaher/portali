title: Domanda di occupazione di suolo pubblico per un dehors (tipo A o B), SUAP Napoli
generated: gen.py from suap-common-occupazione-suolo-pubblico-domanda-di-occupazione-suolo-pubb (2026-10-28) and dictionary/fnsuap.yaml
yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- Have a technician sign the dehors project (plans and report) and attach it
- 'Tick the declarations and commitments yourself: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, the certified mounting, the canone'
- Pay the diritti di segreteria (€ {{ask.diritti_euro}}) and the imposta di bollo with pagoPA
- Sign and send (Firma e invio); once granted, pay the canone unico with the notice the Comune sends
