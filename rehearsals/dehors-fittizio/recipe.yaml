# A bar or restaurant's outdoor seating (dehors: occupazione di suolo pubblico per area annessa a
# un esercizio di somministrazione), as gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-common-occupazione-suolo-pubblico-domanda-di-occupazione-suolo-pubb.json),
# for the pizzeria rehearsal's made-up ditta individuale (rehearsals/pizzeria-fittizia/fixture.json).
# Napoli's rules (the library's napoli/comune/concessione-suolo-pubblico-dehors) are facts the
# person confirms; the technician's project is theirs to attach.
procedure: napoli/comune/concessione-suolo-pubblico-dehors
title: "Domanda di occupazione di suolo pubblico per un dehors (tipo A o B), SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-common-occupazione-suolo-pubblico-domanda-di-occupazione-suolo-pubb
subject: impresa
operation: Domanda di occupazione suolo pubblico per area annessa ad esercizio di somministrazione di alimenti e bevande
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Esercizio di somministrazione di alimenti e bevande in zone NON tutelate], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Domanda di occupazione suolo pubblico per area annessa ad esercizio di somministrazione di alimenti e bevande], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Does any of this apply to the dehors? Tick all that do, or none."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "It's a company with other partners or administrators besides the one who declares", why: "Each files a signed antimafia statement of their own (art. 85 D.Lgs. 159/2011), not mapped yet."}
  coperto: {group: extras, type: yes_no, item: "A covered structure: fixed awnings, platforms or screens (tipo C), or closed on up to three sides (tipo D)", why: "Tipo C and D need further papers (and in the historic centre aren't allowed), not mapped yet."}
  centro_storico: {group: extras, type: yes_no, item: "It's in the historic centre (UNESCO area or buffer zone)", why: "There only tipo A and B, with a central-pole umbrella, and the Soprintendenza may be involved: not mapped yet."}
  musica: {group: extras, type: yes_no, item: "Music or a sound system outside", why: "The dehors then declares it keeps to the acoustic limits; asked so the right box is ticked."}
  nuovo_852: {group: extras, type: yes_no, item: "The business's Reg. 852 notifica isn't filed yet", why: "Then it's filed with this pratica, a branch not mapped yet."}
  descrizione: {type: text, question: "A name for the draft in the portal's Pratiche in bozza", default: "PROVA NON INVIARE - dehors {{business.denominazione}}"}
  diritti_euro: {type: number, question: "The SUAP fees in euro", default: "250", why: "The 2026 table's line for suolo pubblico annesso a pubblici esercizi (DGC 239/2026)."}
  oggetto: {question: "The pratica in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Have a technician sign the dehors project (plans and report) and attach it"
  - "Tick the declarations and commitments yourself: consapevolezza (artt. 46-47), informativa privacy, tasse comunali, the certified mounting, the canone"
  - "Pay the diritti di segreteria (€ {{ask.diritti_euro}}) and the imposta di bollo with pagoPA"
  - "Sign and send (Firma e invio); once granted, pay the canone unico with the notice the Comune sends"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "So far for a ditta individuale or an srl, srls, snc, sas or spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Other partners or administrators file their own antimafia statements as signed attachments (art. 85 D.Lgs. 159/2011): not mapped yet."}
  - {when: "{{ask.coperto|not}}", else: "Covered dehors (tipo C or D) aren't supported yet."}
  - {when: "{{ask.centro_storico|not}}", else: "A dehors in the historic centre isn't supported yet."}
  - {when: "{{ask.nuovo_852|not}}", else: "Filing the Reg. 852 notifica with the dehors isn't supported yet: file the business's opening first."}
