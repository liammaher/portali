# A non-food shop's change of name or registered office (variazioni soggetti), as gen.py writes
# its steps file from the batch crawl (catalogue/F839/sections/suap-016-variazioni-soggetti.json,
# its changes section crawled three deep), for the shop rehearsal's made-up ditta individuale
# (rehearsals/negozio-fittizio/fixture.json): the vault holds the new name and office, the old
# ones are asked.
procedure: napoli/comune/variazioni-attivita
title: "Variazione della denominazione o della sede legale di un negozio di vicinato, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-variazioni-soggetti
subject: impresa
operation: Variazioni soggetti
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Variazioni soggetti], confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Does any of this apply to the business? Tick all that do, or none."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "It's a company with other partners or administrators besides the one who declares", why: "Each files a signed antimafia statement of their own (art. 85 D.Lgs. 159/2011), not mapped yet."}
  descrizione: {type: text, question: "A name for the draft in the portal's Pratiche in bozza", default: "PROVA NON INVIARE - variazione {{business.denominazione}}"}
  var_altro:
    group: variazioni
    type: yes_no
    item: "Something else: shares sold, a new legal representative, new partners, a new professional manager (preposto)"
    why: "Those are a company's changes, or need the new manager's own statement: not mapped yet."
  diritti_euro: {type: number, question: "The SUAP fees in euro (the 2026 table's VPF column: check the line; 0 when none are due)"}
  oggetto: {question: "The pratica in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the declarations yourself: consapevolezza (artt. 46-47), informativa privacy, altre dichiarazioni, tasse comunali"
  - "Pay the diritti di segreteria, if due, with pagoPA on the payment screen"
  - "Sign and send (Firma e invio); keep the receipt"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "So far for a ditta individuale or an srl, srls, snc, sas or spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Other partners or administrators file their own antimafia statements as signed attachments (art. 85 D.Lgs. 159/2011): not mapped yet."}
  - {when: "{{ask.var_altro|not}}", else: "Only a new name or a moved registered office is supported so far."}
  - value: "{{ask.var_denominazione}}-{{ask.var_sede_legale}}"
    in: [true-false, false-true]
    else: "One change at a time here: the shops' form repeats its boxes for each, so file the name and the office separately."
