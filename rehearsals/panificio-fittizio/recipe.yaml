# The SUAP's opening of a bakery (SCIA di panificazione with the Reg. 852/2004 notifica), as
# gen.py writes its steps file from the batch crawl
# (catalogue/F839/sections/suap-004-aprire-l-attivita.json), for this folder's made-up ditta
# individuale (fixture.json). Its own sections (the bakery's data, who runs production) were
# written from the crawl and mod_panifici_apertura; the 852 activity list now has the bakery lines.
procedure: napoli/comune/scia-panificio
title: "SCIA: apertura di un panificio con notifica sanitaria, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-004-aprire-l-attivita
subject: impresa
operation: Aprire l'attività
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Panificio], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: ["Aprire l'attività"], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Does any of this apply to the bakery? Tick all that do, or none."
asks:
  descrizione: {type: text, question: "A name for the draft in the portal's Pratiche in bozza", default: "PROVA NON INVIARE - panificio {{business.denominazione}}"}
  caldaia: {group: extras, type: yes_no, item: "Ovens or heating over 116 kW, or burning solid or liquid fuel", why: "That adds the fire-prevention papers, a branch not mapped yet."}
  farina: {group: extras, type: yes_no, item: "More than 300 kg of flour a day", why: "That adds the fire-prevention papers, a branch not mapped yet."}
  sotterraneo: {group: extras, type: yes_no, item: "Premises below ground (sotterranei or semisotterranei)", why: "That adds the ASL's authorization for underground work, a branch not mapped yet."}
  insegna_esterna: {group: extras, type: yes_no, item: "It will have a sign outside", why: "An outside sign bundles the insegna's SCIA into this one, a branch not mapped yet."}
  diritti_euro: {type: number, question: "The SUAP fees in euro (the 2026 table's line for a bakery with the notifica sanitaria)"}
  oggetto: {question: "The pratica in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the declarations yourself: consapevolezza (artt. 46-47), informativa privacy, requisiti antimafia and what the production manager guarantees, altre dichiarazioni, art. 75 DPR 445/2000, art. 6 Reg. 852/2004, tasse comunali"
  - "Pay the diritti di segreteria (€ {{ask.diritti_euro}}) with pagoPA on the payment screen, and the ASL tariffa forfettaria"
  - "Sign and send (Firma e invio); keep the receipt"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale]
    else: "So far only for a ditta individuale: a company's Scheda anagrafica isn't mapped."
  - when: "{{business.rea|empty}}"
    else: "So far only for a business not yet in the Registro delle imprese."
  - {when: "{{ask.caldaia|not}}", else: "Ovens or heating over 116 kW, or solid or liquid fuel, aren't supported yet: they add fire prevention."}
  - {when: "{{ask.farina|not}}", else: "More than 300 kg of flour a day isn't supported yet: it adds fire prevention."}
  - {when: "{{ask.sotterraneo|not}}", else: "Underground premises aren't supported yet: they add the ASL's authorization."}
  - {when: "{{ask.insegna_esterna|not}}", else: "An outside sign isn't supported yet: it bundles the insegna's SCIA into this one."}
  - {when: "{{ask.forno}}", else: "This is a bakery's pratica: the notifica's bakery lines must apply."}
  - {when: "{{ask.ristorazione|not}}", else: "Food service isn't a bakery's: it's the bar or restaurant pratica."}
