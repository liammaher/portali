yours:
- Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page
- Tick the sign's statements yourself (ulteriori dichiarazioni, mezzi pubblicitari)
- 'Tick the declarations yourself: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000'
- Pay the diritti di segreteria (€ {{ask.diritti_euro}}) with pagoPA on the payment screen
- Sign and send (Firma e invio); keep the receipt
