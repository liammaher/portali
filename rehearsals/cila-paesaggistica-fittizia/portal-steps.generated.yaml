    question: Which items of DPR 31/2017's Allegato B do the works fall under? Tick every one that applies.
  cila_interventi:
    question: What are the works, for the CILA's relazione tecnica? Tick every line that applies.
  tolleranze_tipi:
    question: Which construction tolerances does the relazione declare? Tick every one that applies.
  fatti:
    question: Quali di queste cose valgono per i lavori? Spunta quelle vere, anche nessuna.
