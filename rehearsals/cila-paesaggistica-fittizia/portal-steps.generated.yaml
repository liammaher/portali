supports:
- value: '{{ask.direttore_lavori}}'
  in:
  - progettista
  - da nominare
  else: Another technician as direttore dei lavori isn't mapped yet (quadro G1's second block).
- when: '{{ask.altri_tecnici|not}}'
  else: Other technicians already appointed (structures, systems, acoustics) aren't mapped yet (quadro G2's rows).
- when: '{{ask.altri_atti|not}}'
  else: Other filings or assents with the CILA (Soprintendenza, ASL, fire brigade) aren't mapped yet; a landscape authorization goes in the same pratica (the CILA with its semplificata).
- when: '{{ask.paes_variante|not}}'
  else: 'So far only for a new authorization: the variant of one already issued isn''t run yet.'
- when: '{{ask.bollo_marche|not}}'
  else: 'So far only with the bollo paid on pagoPA: the marche route isn''t run yet.'
