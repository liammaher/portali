# A non-food shop's bigger sales area (variazioni strutturali), as gen.py writes its steps file
# from the batch crawl (catalogue/F839/sections/suap-016-variazioni-strutturali.json), for the
# shop rehearsal's made-up ditta individuale (rehearsals/negozio-fittizio/fixture.json).
procedure: napoli/comune/variazioni-attivita
title: "Ampliamento della superficie di vendita di un negozio di vicinato non alimentare, SUAP Napoli"
comune: F839
sportello: suap
crawl: suap-016-variazioni-strutturali
subject: impresa
operation: Variazioni strutturali
start: https://suap.impresainungiorno.gov.it/fnsuap/cmd/create?comune=F839
after: [Pagamento degli oneri, Gestione degli allegati]
wizard:
  - screen: Assegna una descrizione alla pratica
    fill: {css: 'input[placeholder^="Inserire la descrizione"]', value: "{{ask.descrizione}}"}
    confirm: CONFERMA
  - {screen: Controlla l'accesso alla pratica, confirm: CONFERMA}
  - {screen: Scelta settore attività, tree: [Vicinato - settore merceologico NON alimentare], confirm: CONFERMA}
  - {screen: Scelta operazioni, tree: [Variazioni strutturali], confirm: CONFERMA}
  - {screen: Scelta interventi eventuali, confirm: CONFERMA}
  - {screen: Scelta del destinatario della pratica, confirm: CONFERMA}
  - {screen: Scelte eventuali, confirm: CONFERMA}
groups:
  extras:
    question: "Does any of this apply to the shop? Tick all that do, or none."
asks:
  altri_soggetti: {group: extras, type: yes_no, item: "It's a company with other partners or administrators besides the one who declares", why: "Each files a signed antimafia statement of their own (art. 85 D.Lgs. 159/2011), not mapped yet."}
  descrizione: {type: text, question: "A name for the draft in the portal's Pratiche in bozza", default: "PROVA NON INVIARE - ampliamento {{business.denominazione}}"}
  grande: {group: extras, type: yes_no, item: "More than 400 m² in all after the change (stores and services included), or a fire-prevention activity", why: "That adds the fire-prevention SCIA to this pratica, a branch not mapped yet."}
  settori: {group: extras, type: yes_no, item: "It adds, drops or swaps a sector or special goods (tobacco, medicines, fuel)", why: "Only a bigger area in the same sectors is mapped."}
  insegna_esterna: {group: extras, type: yes_no, item: "A new outside sign", why: "An outside sign bundles the insegna's SCIA into this one, a branch not mapped yet."}
  diritti_euro: {type: number, question: "The SUAP fees in euro (the 2026 table's VCA column for a non-food shop, S1: check it)"}
  oggetto: {question: "The pratica in one sentence (300 characters)"}
yours:
  - "Open the draft in Pratiche in bozza ({{ask.descrizione}}) and check it against this page"
  - "Tick the declarations yourself: consapevolezza (artt. 46-47), informativa privacy, requisiti di onorabilità, altre dichiarazioni, tasse comunali, art. 75 DPR 445/2000"
  - "Pay the diritti di segreteria (€ {{ask.diritti_euro}}) with pagoPA on the payment screen"
  - "Sign and send (Firma e invio); keep the receipt"
supports:
  - value: "{{business.forma_giuridica}}"
    in: [ditta_individuale, srl, srls, snc, sas, spa]
    else: "So far for a ditta individuale or an srl, srls, snc, sas or spa."
  - {when: "{{ask.altri_soggetti|not}}", else: "Other partners or administrators file their own antimafia statements as signed attachments (art. 85 D.Lgs. 159/2011): not mapped yet."}
  - {when: "{{ask.grande|not}}", else: "Over 400 m² or a fire-prevention activity isn't supported yet."}
  - {when: "{{ask.settori|not}}", else: "Only a bigger area in the same sectors is supported so far."}
  - {when: "{{ask.insegna_esterna|not}}", else: "An outside sign isn't supported yet."}
  - {when: "{{ask.superficie_alimentare_mq|positive|not}}", else: "This is the non-food shop's pratica."}
