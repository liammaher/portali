# Answer key for P6 (dossier-p6.md), written before any mapping of the SUE.
#
# Written by Claude on 2026-10-28 from the dossier and the fields of the Mod.CILA-23-06-2025
# (the library's mapping, pratiche-napoli procedures/napoli/comune/cila-lavori-edilizi.yaml),
# by common sense where a professional would choose. Weakest key: its author also maps the
# portal (README, Changes). Liam reviews it before the first run.
#
# The portal's online modules follow the Mod.CILA, so each entry is a Mod.CILA field; the
# first walk records which portal field each one became. A run is scored on the saved draft
# (a fresh load, or the CILA PDF the portal generates), never on our review page.
#   expect:  the value, compared after normalising case and spaces
#   choose:  the box ticked (one of the options in the label)
#   same_as: the meaning must match; the wording may differ (free text)
#   blank:   nothing there
#   theirs:  the person's own act (a declaration, a signature): must be left undone
# filed_on is the day of the run, "Napoli" the place, wherever the form asks for both.

