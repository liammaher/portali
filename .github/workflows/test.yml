name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # The plugin's pvault installer against a fake release (plugin/test_install.py).
      - name: Installer
        run: |
          python3 -m pip install pyyaml
          python3 plugin/test_install.py

  # peer_darwin.go and the Swift Touch ID helper compile only here, and their
  # tests skip elsewhere.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Test
        run: go test -race ./cmd/...

  # The named pipe, peer checks and folder ACLs of *_windows.go compile and run
  # only here. No -race: it needs cgo on Windows.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  mcp:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - name: Install
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npx tsc -p tsconfig.test.json

      - name: Test
        run: npm test
