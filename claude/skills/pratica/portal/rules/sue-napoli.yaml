schema_version: 0
id: sue-napoli
title: "SUE di Napoli: quale titolo edilizio serve per i lavori (CILA, SCIA, SCIA alternativa o permesso di costruire)"
updated: 2026-10-29
intro: >-
  Da poche risposte sui lavori (che cosa sono, se toccano le strutture o i prospetti, se cambiano
  l'uso, i vincoli) al titolo da presentare allo Sportello Unico per l'Edilizia di Napoli, a quello
  che va con esso (l'autorizzazione paesaggistica nella stessa pratica) e a quello che si presenta a
  parte (il deposito o l'autorizzazione sismica al Genio Civile). Dove la legge lascia scegliere tra
  SCIA e permesso, la scelta è una delle risposte. I cambi di destinazione d'uso seguono anche la
  legge regionale campana, letta con la circolare regionale CI/2025/3. Le sanatorie e i casi che
  la libreria non copre ancora sono rifiutati, con il motivo.
facts:
  intervento:
    type: choice
    question: "Che lavori sono, secondo le definizioni dell'art. 3 DPR 380/2001?"
    values:
      edilizia_libera: >-
        Lavori senza titolo dell'art. 6 c. 1: manutenzione ordinaria (riparare, rinnovare e
        sostituire finiture, tenere in efficienza gli impianti), barriere architettoniche senza
        ascensori esterni né modifiche della sagoma, VEPA, tende e pergole a telo retrattile,
        pavimentazioni esterne e simili
      opere_temporanee: "Opere stagionali o per esigenze contingenti e temporanee, da rimuovere entro 180 giorni, montaggio e smontaggio compresi (art. 6 c. 1 e-bis)"
      nessuna_opera: "Nessun lavoro: solo un cambio di destinazione d'uso"
      manutenzione_straordinaria: "Manutenzione straordinaria (art. 3 c. 1 b): rinnovare e sostituire parti dell'edificio, servizi igienici e impianti, frazionare o accorpare unità"
      restauro: "Restauro e risanamento conservativo (art. 3 c. 1 c)"
      ristrutturazione: "Ristrutturazione edilizia (art. 3 c. 1 d) che non è uno dei casi dell'art. 10 c. 1 c"
      ristrutturazione_pesante: >-
        Ristrutturazione edilizia dell'art. 10 c. 1 c: un organismo in parte o del tutto diverso con
        più volume, o con cambio d'uso in zona omogenea A, o che cambia sagoma, volume o prospetti di
        un immobile tutelato, o la demolizione e ricostruzione in un'area tutelata (artt. 136 c. 1 c
        e d, 142) con modifiche
      nuova_costruzione: "Nuova costruzione (art. 3 c. 1 e), compresi gli ampliamenti fuori sagoma"
      ristrutturazione_urbanistica: "Ristrutturazione urbanistica (art. 3 c. 1 f)"
      variante_pdc: "Variante in corso d'opera a un permesso di costruire che non è una variazione essenziale"
      variante_essenziale_pdc: "Variante in corso d'opera a un permesso di costruire che è una variazione essenziale"
      variante_scia: "Variante in corso d'opera a una SCIA (essenziale o no)"
      altro: >-
        Altro: permesso in deroga (art. 14), permesso convenzionato (art. 28-bis), sottotetti,
        parcheggi o Piano casa delle leggi regionali, proroghe e volture
    how: Lo stabilisce il tecnico dalle definizioni dell'art. 3 e dall'elenco dell'art. 6 DPR 380/2001.
  sanatoria:
    type: yes_no
    question: "I lavori sono già iniziati, o già finiti, senza il titolo che serviva?"
  strutture:
    type: yes_no
    question: "I lavori toccano le parti strutturali dell'edificio?"
  prospetti:
    type: yes_no
    question: "La manutenzione straordinaria modifica i prospetti (le facciate) dell'edificio?"
  sismica:
    type: choice
    question: "Per le opere strutturali, che cosa chiede la normativa sismica?"
    values:
      deposito: "Il deposito del progetto (interventi di minore rilevanza o privi di rilevanza, art. 94-bis c. 1 b e c)"
      autorizzazione: "L'autorizzazione preventiva (interventi rilevanti, art. 94-bis c. 1 a)"
      variante: "Una variante non sostanziale a un progetto strutturale già depositato o autorizzato"
    how: Lo stabilisce il progettista delle strutture (art. 94-bis DPR 380/2001 e Regolamento regionale 4/2010).
  cambio_uso:
    type: choice
    question: "I lavori cambiano la destinazione d'uso? Si sceglie il primo caso che vale."
    values:
      "no": "No"
      zona_agricola: "Sì, in una zona agricola (zona E del PRG)"
      non_rilevante: >-
        Sì, ma il cambio non aumenta il fabbisogno di standard urbanistici (aree per servizi e
        parcheggi): in Campania non è urbanisticamente rilevante
      stessa_categoria: "Sì, di una singola unità, restando nella stessa categoria funzionale"
      tra_categorie: >-
        Sì, di una singola unità in un immobile delle zone A, B o C del D.M. 1444/1968, tra le
        categorie residenziale, turistico-ricettiva, produttiva e direzionale, commerciale (art.
        23-ter c. 1-ter), non al piano terra né seminterrata
      piano_terra: "Sì, di una singola unità al piano terra (primo piano fuori terra) o seminterrata, verso un'altra categoria funzionale"
      intero_immobile: "Sì, di un intero immobile, restando nella stessa categoria funzionale"
      intero_tra_categorie: "Sì, di un intero immobile, verso un'altra categoria funzionale"
      altro: >-
        Sì, in un altro modo: un'unità fuori delle zone A, B e C (o equipollenti) verso un'altra
        categoria, o verso o dalla categoria rurale fuori della zona E
    how: >-
      Le categorie funzionali sono quelle dell'art. 23-ter c. 1 DPR 380/2001 (residenziale,
      turistico-ricettiva, produttiva e direzionale, commerciale, rurale). Il fabbisogno di
      standard lo stabilisce il tecnico dalle dotazioni che il PRG chiede per la nuova
      destinazione (art. 2 c. 4 L.R. Campania 13/2022, art. 27 c. 2 L.R. 31/2021).
  uso_ammesso_prg:
    type: yes_no
    question: "La nuova destinazione d'uso è tra quelle che il PRG ammette in quella zona?"
  verso_a2_tavola_7a:
    type: yes_no
    question: >-
      Il cambio porta un'abitazione ordinaria (a.1) a B&B, affittacamere, casa o appartamento per
      vacanze o locazione breve non imprenditoriale (a.2), in un edificio dell'area della tavola 7a
      del centro storico?
    how: >-
      Le sottocategorie sono quelle dell'art. 21 delle norme della Variante generale come modificato
      dalla D.C.C. 129/2026; l'area è quella della tavola 7a "centro storico, area di salvaguardia
      dell'offerta abitativa ordinaria".
  cambio_uso_sagoma:
    type: yes_no
    question: "Le opere che accompagnano il cambio d'uso dell'immobile incidono sulla sagoma o ne aumentano i volumi?"
  paesaggio:
    type: choice
    question: "L'immobile è sotto tutela paesaggistica (artt. 136 o 142 D.Lgs. 42/2004), e che cosa chiedono i lavori?"
    values:
      "no": "Non è sotto tutela paesaggistica"
      senza_autorizzazione: >-
        È tutelato, ma i lavori non alterano i luoghi né l'aspetto esteriore degli edifici, o sono
        nell'Allegato A del D.P.R. 31/2017 (art. 149 D.Lgs. 42/2004)
      semplificata: "L'autorizzazione semplificata: lavori di lieve entità dell'Allegato B del D.P.R. 31/2017"
      ordinaria: "L'autorizzazione ordinaria (art. 146): gli altri lavori che alterano i luoghi o l'aspetto esteriore"
    how: Lo stabilisce il tecnico dal vincolo e dagli Allegati A e B del D.P.R. 31/2017.
  paesaggio_eseguiti:
    type: yes_no
    question: "Le opere che chiedono l'autorizzazione paesaggistica sono già state eseguite, anche in parte?"
  bene_culturale:
    type: yes_no
    question: "L'edificio è un bene culturale tutelato dalla Parte II del D.Lgs. 42/2004 (vincolo storico-artistico)?"
  demolizione_zona_a:
    type: yes_no
    question: >-
      I lavori demoliscono e ricostruiscono un edificio, o la variante cambia la sagoma, in zona A
      della Variante generale al PRG o della Variante occidentale?
    how: La zona si legge nella tavola di zonizzazione del PRG di Napoli.
  piano_planovolumetrico:
    type: yes_no
    question: >-
      La nuova costruzione o la ristrutturazione urbanistica è disciplinata da un piano attuativo
      con precise disposizioni plano-volumetriche dichiarate dal Comune, o (per una nuova
      costruzione) è in diretta esecuzione di uno strumento urbanistico generale che le contiene?
  permesso_per_scelta:
    type: yes_no
    question: >-
      La legge qui lascia scegliere: si chiede il permesso di costruire invece della SCIA (art. 22 c.
      7) o della SCIA alternativa (art. 23)?
rules:
  # --- Casi che la libreria non copre ---
  - id: altro
    when: {intervento: [altro]}
    then: {refuse: "Il permesso in deroga, il permesso convenzionato, gli interventi delle leggi regionali (sottotetti, parcheggi, Piano casa), le proroghe e le volture non sono ancora in questa tabella."}
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: pdc-modulo}]
    status: verified
  - id: opere-temporanee-bene-culturale
    when: {intervento: [opere_temporanee], bene_culturale: true}
    then: {refuse: "Su un bene culturale anche le opere temporanee chiedono l'autorizzazione del soprintendente (art. 21 c. 4 D.Lgs. 42/2004): la libreria non copre ancora la CIL con quell'autorizzazione."}
    cites: [{procedure: napoli/comune/cil-opere-temporanee, source: dlgs42-art21}]
    status: verified
  - id: nessuna-opera-nessun-cambio
    when: {intervento: [nessuna_opera], cambio_uso: ["no"]}
    then: {refuse: "Senza lavori né cambio di destinazione d'uso non c'è una pratica edilizia da presentare."}
    status: verified
  - id: cambio-uso-altro
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante], cambio_uso: [altro]}
    then: {refuse: "Questo cambio di destinazione d'uso (un'unità fuori delle zone A, B e C, o verso o dalla categoria rurale fuori della zona E) non è nei casi che la libreria ha verificato."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}]
    status: verified
  - id: uso-non-ammesso
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante], cambio_uso: [zona_agricola, non_rilevante, stessa_categoria, tra_categorie, piano_terra, intero_immobile, intero_tra_categorie], uso_ammesso_prg: false}
    then: {refuse: "La nuova destinazione d'uso è ammissibile solo se il PRG la indica come compatibile per quella zona (art. 27 c. 2 L.R. Campania 31/2021): così il cambio non si può fare."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: lr31-2021}]
    status: verified
  - id: centro-storico-a1-a2
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante], cambio_uso: [non_rilevante, stessa_categoria, intero_immobile], verso_a2_tavola_7a: true}
    then: {refuse: "Dal 27/10/2026, nell'area della tavola 7a del centro storico il passaggio da abitazione ordinaria (a.1) a B&B, affittacamere, casa vacanze o locazione breve (a.2) è limitato da una soglia di residenzialità ordinaria del 70% dell'intero edificio (art. 63 c. 8 delle norme, D.C.C. 129/2026), e il modo di verificarla non è ancora verificato: va chiesto al SUE."}
    cites:
      - {procedure: napoli/comune/scia-edilizia, source: variante-dcc-129}
      - {procedure: napoli/comune/scia-edilizia, source: variante-burc-58}
    status: verified
  # Per un'unità al piano terra o seminterrata l'art. 23-ter rimette il cambio alla legge
  # regionale, e la circolare regionale non ne indica il titolo.
  - id: cambio-uso-piano-terra
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante], cambio_uso: [piano_terra]}
    then:
      role: main
      procedure: napoli/comune/scia-alternativa-pdc
      regime: scia
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Segnalazione Certificata Inizio Attività alternativa al Permesso di Costruire (S.C.I.A. alternativa P.d.C.)"}
    cites:
      - {procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}
      - {procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}
    status: unverified
    note: >-
      Per un'unità al piano terra o seminterrata il cambio verso un'altra categoria è rimesso alla
      legge regionale (art. 23-ter c. 1-quater DPR 380/2001), e la circolare regionale CI/2025/3 non
      ne indica il titolo. La regola generale della L.R. Campania 13/2022 (art. 2 c. 6) porterebbe
      alla SCIA alternativa al permesso di costruire, ma non è verificato: va chiesto al SUE. Se il
      cambio non aumenta il fabbisogno di standard urbanistici non è rilevante ed è libero (art. 2
      c. 4).

  # --- Lavori già eseguiti ---
  - id: sanatoria-titolo
    when: {sanatoria: true, intervento: [opere_temporanee, ristrutturazione, ristrutturazione_pesante, nuova_costruzione, ristrutturazione_urbanistica, variante_pdc, variante_essenziale_pdc, variante_scia]}
    then: {refuse: "Per lavori già eseguiti senza titolo serve una sanatoria (accertamento di conformità, artt. 36 e 36-bis DPR 380/2001), che la libreria non copre ancora."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: scia-modulo}]
    status: verified
  - id: sanatoria-strutture
    when: {sanatoria: true, intervento: [manutenzione_straordinaria, restauro], strutture: true}
    then: {refuse: "Per lavori già eseguiti senza titolo serve una sanatoria (accertamento di conformità, artt. 36 e 36-bis DPR 380/2001), che la libreria non copre ancora."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: scia-modulo}]
    status: verified
  - id: sanatoria-prospetti
    when: {sanatoria: true, intervento: [manutenzione_straordinaria], strutture: false, prospetti: true}
    then: {refuse: "Per lavori già eseguiti senza titolo serve una sanatoria (accertamento di conformità, artt. 36 e 36-bis DPR 380/2001), che la libreria non copre ancora."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: scia-modulo}]
    status: verified
  - id: sanatoria-cambio-uso
    when: {sanatoria: true, intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [zona_agricola, stessa_categoria, tra_categorie, intero_immobile, intero_tra_categorie]}
    then: {refuse: "Un cambio di destinazione d'uso già fatto senza titolo va sanato (accertamento di conformità, art. 36-bis DPR 380/2001), e la libreria non copre ancora la sanatoria."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: scia-modulo}]
    status: verified
  - id: sanatoria-paesaggio
    when: {paesaggio: [semplificata, ordinaria], paesaggio_eseguiti: true}
    then: {refuse: "L'autorizzazione paesaggistica non si rilascia per lavori già eseguiti (art. 146 c. 4 D.Lgs. 42/2004): serve l'accertamento di compatibilità paesaggistica, che la libreria non copre ancora."}
    cites: [{procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: dlgs42-art146}]
    status: verified

  # --- Edilizia libera ---
  - id: edilizia-libera
    when: {intervento: [edilizia_libera], cambio_uso: ["no"], paesaggio: ["no", senza_autorizzazione], bene_culturale: false}
    then: {none: "Sono lavori di edilizia libera (art. 6 c. 1 DPR 380/2001): non serve un titolo edilizio né una pratica al SUE."}
    cites: [{procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6}]
    status: verified
  - id: cambio-uso-non-rilevante-senza-opere
    when: {intervento: [nessuna_opera], cambio_uso: [non_rilevante], uso_ammesso_prg: true}
    then: {none: "Un cambio d'uso senza opere che non aumenta il fabbisogno di standard urbanistici non è rilevante in Campania ed è liberamente attuabile (art. 2 c. 4 L.R. 13/2022): non serve una pratica al SUE."}
    cites:
      - {procedure: napoli/comune/scia-edilizia, source: lr13-2022}
      - {procedure: napoli/comune/scia-edilizia, source: circolare-salva-casa-campania}
    status: verified
  - id: cambio-uso-non-rilevante-senza-titolo
    when: {intervento: [edilizia_libera], cambio_uso: [non_rilevante], uso_ammesso_prg: true, paesaggio: ["no", senza_autorizzazione], bene_culturale: false}
    then: {none: "Un cambio d'uso che non aumenta il fabbisogno di standard urbanistici non è rilevante in Campania ed è liberamente attuabile (art. 2 c. 4 L.R. 13/2022), e i lavori sono di edilizia libera: non serve una pratica al SUE."}
    cites:
      - {procedure: napoli/comune/scia-edilizia, source: lr13-2022}
      - {procedure: napoli/comune/scia-edilizia, source: circolare-salva-casa-campania}
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6}
    status: verified
  - id: edilizia-libera-paesaggistica-semplificata
    when: {intervento: [edilizia_libera], cambio_uso: ["no", non_rilevante], paesaggio: [semplificata]}
    then:
      role: main
      procedure: napoli/comune/autorizzazione-paesaggistica-semplificata
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune)"}
    cites:
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: dpr31-art3}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: portale-sue-operazioni}
    status: verified
  - id: edilizia-libera-paesaggistica-ordinaria
    when: {intervento: [edilizia_libera], cambio_uso: ["no", non_rilevante], paesaggio: [ordinaria]}
    then:
      role: main
      procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Autorizzazione paesaggistica ordinaria (art.146 del D.Lgs 42/2004 - Comune)"}
    cites:
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: dlgs42-art146}
      - {procedure: napoli/comune/autorizzazione-paesaggistica-ordinaria, source: portale-sue-operazioni}
    status: verified
  - id: edilizia-libera-bene-culturale
    when: {intervento: [edilizia_libera], cambio_uso: ["no", non_rilevante], bene_culturale: true}
    then: {refuse: "Su un bene culturale anche i lavori senza titolo edilizio chiedono l'autorizzazione del soprintendente (art. 21 c. 4 D.Lgs. 42/2004), che la libreria non copre ancora."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: dlgs42-art21}]
    status: verified

  # --- CIL ---
  - id: cil
    when: {intervento: [opere_temporanee]}
    then:
      role: main
      procedure: napoli/comune/cil-opere-temporanee
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione di Inizio Lavori per opere temporanee (C.I.L.)"}
    cites:
      - {procedure: napoli/comune/cil-opere-temporanee, source: dpr380-art6}
      - {procedure: napoli/comune/cil-opere-temporanee, source: portale-sue-operazioni}
    status: verified

  # --- CILA ---
  - id: cila-manutenzione
    when: {intervento: [manutenzione_straordinaria], strutture: false, prospetti: false, cambio_uso: ["no", non_rilevante]}
    then:
      role: main
      procedure: napoli/comune/cila-lavori-edilizi
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)"}
    cites:
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6bis}
      - {procedure: napoli/comune/cila-lavori-edilizi, source: cila-note}
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art22}
      - {procedure: napoli/comune/scia-edilizia, source: lr13-2022}
    status: verified
  - id: cila-restauro
    when: {intervento: [restauro], strutture: false, cambio_uso: ["no", non_rilevante]}
    then:
      role: main
      procedure: napoli/comune/cila-lavori-edilizi
      regime: comunicazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Comunicazione Inizio Lavoro Asseverata (C.I.L.A.)"}
    cites:
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art6bis}
      - {procedure: napoli/comune/cila-lavori-edilizi, source: cila-note}
      - {procedure: napoli/comune/cila-lavori-edilizi, source: dpr380-art22}
      - {procedure: napoli/comune/scia-edilizia, source: lr13-2022}
    status: verified
  - id: cila-manutenzione-bene-culturale
    when: {intervento: [manutenzione_straordinaria], strutture: false, prospetti: false, cambio_uso: ["no", non_rilevante], bene_culturale: true}
    then: {refuse: "Una CILA su un bene culturale chiede anche l'autorizzazione del soprintendente (art. 21 c. 4 D.Lgs. 42/2004): la libreria non copre ancora la CILA con quell'autorizzazione."}
    cites: [{procedure: napoli/comune/cila-lavori-edilizi, source: dlgs42-art21}]
    status: verified
  - id: cila-restauro-bene-culturale
    when: {intervento: [restauro], strutture: false, cambio_uso: ["no", non_rilevante], bene_culturale: true}
    then: {refuse: "Una CILA su un bene culturale chiede anche l'autorizzazione del soprintendente (art. 21 c. 4 D.Lgs. 42/2004): la libreria non copre ancora la CILA con quell'autorizzazione."}
    cites: [{procedure: napoli/comune/cila-lavori-edilizi, source: dlgs42-art21}]
    status: verified

  # --- SCIA, o il permesso di costruire per scelta (art. 22 c. 7) ---
  - id: scia-strutture
    when: {intervento: [manutenzione_straordinaria, restauro], strutture: true, permesso_per_scelta: false, cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie]}
    then: &scia
      role: main
      procedure: napoli/comune/scia-edilizia
      regime: scia
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Segnalazione Certificata di Inizio Attività Edilizia (S.C.I.A.)"}
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  - id: permesso-per-scelta-strutture
    when: {intervento: [manutenzione_straordinaria, restauro], strutture: true, permesso_per_scelta: true, cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie]}
    then: &permesso
      role: main
      procedure: napoli/comune/permesso-di-costruire
      regime: permesso
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Permesso di Costruire (P.d.C) - Art.10 D.P.R. 380/2001"}
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}, {procedure: napoli/comune/permesso-di-costruire, source: pdc-modulo}]
    status: verified
  - id: scia-prospetti
    when: {intervento: [manutenzione_straordinaria], strutture: false, prospetti: true, permesso_per_scelta: false, cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie]}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  - id: permesso-per-scelta-prospetti
    when: {intervento: [manutenzione_straordinaria], strutture: false, prospetti: true, permesso_per_scelta: true, cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie]}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}, {procedure: napoli/comune/permesso-di-costruire, source: pdc-modulo}]
    status: verified
  # A single unit follows art. 23-ter c. 1-quinquies; a whole building the L.R. 13/2022 (circolare
  # regionale CI/2025/3, punti a-d).
  - id: scia-cambio-uso
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [stessa_categoria], uso_ammesso_prg: true, permesso_per_scelta: false}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}, {procedure: napoli/comune/scia-edilizia, source: circolare-salva-casa-campania}]
    status: verified
  - id: permesso-per-scelta-cambio-uso
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [stessa_categoria], uso_ammesso_prg: true, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}, {procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  # Edilizia libera works count as "senza opere" for art. 23-ter, not (verified) for art. 2 c. 5
  # L.R. 19/2001: they stay a SCIA.
  - id: scia-cambio-uso-tra-categorie
    when: {intervento: [edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [tra_categorie], uso_ammesso_prg: true, permesso_per_scelta: false}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}, {procedure: napoli/comune/scia-edilizia, source: circolare-salva-casa-campania}]
    status: verified
  - id: permesso-per-scelta-cambio-uso-tra-categorie
    when: {intervento: [edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [tra_categorie], uso_ammesso_prg: true, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art23ter}, {procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  - id: cambio-uso-tra-categorie-senza-opere
    when: {intervento: [nessuna_opera], cambio_uso: [tra_categorie, intero_tra_categorie], uso_ammesso_prg: true}
    then: {none: "Un cambio d'uso senza opere tra categorie compatibili con la zona del PRG è libero in Campania (art. 2 c. 5 L.R. 19/2001): non serve una pratica al SUE."}
    cites: [{procedure: napoli/comune/scia-edilizia, source: lr19-2001}, {procedure: napoli/comune/scia-edilizia, source: circolare-salva-casa-campania}]
    status: verified
  - id: scia-alternativa-intero-immobile-senza-opere
    when: {intervento: [nessuna_opera], cambio_uso: [intero_immobile], uso_ammesso_prg: true, permesso_per_scelta: false}
    then: &alternativa
      role: main
      procedure: napoli/comune/scia-alternativa-pdc
      regime: scia
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Segnalazione Certificata Inizio Attività alternativa al Permesso di Costruire (S.C.I.A. alternativa P.d.C.)"}
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/scia-alternativa-pdc, source: circolare-salva-casa-campania}]
    status: verified
  - id: permesso-per-scelta-intero-immobile-senza-opere
    when: {intervento: [nessuna_opera], cambio_uso: [intero_immobile], uso_ammesso_prg: true, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/permesso-di-costruire, source: dpr380-art23}]
    status: verified
  - id: scia-alternativa-intero-immobile
    when: {intervento: [edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/scia-alternativa-pdc, source: circolare-salva-casa-campania}]
    status: verified
  - id: permesso-per-scelta-intero-immobile
    when: {intervento: [edilizia_libera, manutenzione_straordinaria, restauro], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/permesso-di-costruire, source: dpr380-art23}]
    status: verified
  - id: permesso-zona-agricola
    when: {intervento: [nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante], cambio_uso: [zona_agricola], uso_ammesso_prg: true}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: lr19-2001}]
    status: verified
  - id: scia-ristrutturazione
    when: {intervento: [ristrutturazione], cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie], demolizione_zona_a: false, permesso_per_scelta: false}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  - id: permesso-per-scelta-ristrutturazione
    when: {intervento: [ristrutturazione], cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie], demolizione_zona_a: false, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}, {procedure: napoli/comune/permesso-di-costruire, source: pdc-modulo}]
    status: verified
  - id: scia-variante-permesso
    when: {intervento: [variante_pdc], demolizione_zona_a: false, permesso_per_scelta: false}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}, {procedure: napoli/comune/scia-edilizia, source: dlgs222-tabella-a}]
    status: verified
  - id: permesso-per-scelta-variante
    when: {intervento: [variante_pdc], demolizione_zona_a: false, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-edilizia, source: dpr380-art22}]
    status: verified
  - id: scia-variante-scia
    when: {intervento: [variante_scia]}
    then: *scia
    cites: [{procedure: napoli/comune/scia-edilizia, source: scia-modulo}]
    status: verified
  - id: scia-alternativa-ristrutturazione-intero-immobile
    when: {intervento: [ristrutturazione], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, cambio_uso_sagoma: false, demolizione_zona_a: false, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/scia-alternativa-pdc, source: circolare-salva-casa-campania}]
    status: verified
  - id: permesso-per-scelta-ristrutturazione-intero-immobile
    when: {intervento: [ristrutturazione], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, cambio_uso_sagoma: false, demolizione_zona_a: false, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/permesso-di-costruire, source: dpr380-art23}]
    status: verified
  - id: permesso-cambio-uso-sagoma
    when: {intervento: [ristrutturazione, ristrutturazione_pesante], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, cambio_uso_sagoma: true}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: lr19-2001}, {procedure: napoli/comune/permesso-di-costruire, source: circolare-salva-casa-campania}]
    status: verified
  # A Napoli la SCIA è esclusa per la demolizione e ricostruzione, e per le varianti che cambiano la sagoma, in zona A.
  - id: permesso-zona-a
    when: {intervento: [ristrutturazione, variante_pdc], demolizione_zona_a: true}
    then: *permesso
    cites:
      - {procedure: napoli/comune/permesso-di-costruire, source: scia-pagina}
      - {procedure: napoli/comune/permesso-di-costruire, source: dlgs222-tabella-a}
      - {procedure: napoli/comune/scia-edilizia, source: dpr380-art22}
    status: verified

  # --- Permesso di costruire, o la SCIA alternativa (art. 23) ---
  - id: scia-alternativa-ristrutturazione
    when: {intervento: [ristrutturazione_pesante], cambio_uso: ["no", non_rilevante, stessa_categoria, tra_categorie], demolizione_zona_a: false, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: dpr380-art23}]
    status: verified
  - id: scia-alternativa-ristrutturazione-pesante-intero-immobile
    when: {intervento: [ristrutturazione_pesante], cambio_uso: [intero_immobile, intero_tra_categorie], uso_ammesso_prg: true, cambio_uso_sagoma: false, demolizione_zona_a: false, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: dpr380-art23}, {procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}]
    status: verified
  - id: permesso-ristrutturazione
    when: {intervento: [ristrutturazione_pesante], permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: dpr380-art10}]
    status: verified
  - id: scia-alternativa-zona-a
    when: {intervento: [ristrutturazione_pesante], demolizione_zona_a: true, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: lr13-2022}, {procedure: napoli/comune/scia-alternativa-pdc, source: scia-pagina}]
    status: disputed
    note: >-
      Per una demolizione e ricostruzione in zona A la L.R. Campania 13/2022 (art. 2 c. 8) indica la
      SCIA alternativa al permesso di costruire, salve le previsioni comunali più restrittive, mentre
      il Comune riporta che la DGC 454/2014 esclude la SCIA in zona A: va chiesto al SUE, o si chiede
      il permesso di costruire.
  - id: permesso-nuova-costruzione
    when: {intervento: [nuova_costruzione, ristrutturazione_urbanistica], piano_planovolumetrico: false}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: dpr380-art10}]
    status: verified
  - id: scia-alternativa-nuova-costruzione
    when: {intervento: [nuova_costruzione, ristrutturazione_urbanistica], piano_planovolumetrico: true, permesso_per_scelta: false}
    then: *alternativa
    cites: [{procedure: napoli/comune/scia-alternativa-pdc, source: dpr380-art23}]
    status: verified
  - id: permesso-per-scelta-nuova-costruzione
    when: {intervento: [nuova_costruzione, ristrutturazione_urbanistica], piano_planovolumetrico: true, permesso_per_scelta: true}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: dpr380-art10}, {procedure: napoli/comune/permesso-di-costruire, source: dpr380-art23}]
    status: verified
  - id: permesso-variante-essenziale
    when: {intervento: [variante_essenziale_pdc]}
    then: *permesso
    cites: [{procedure: napoli/comune/permesso-di-costruire, source: dlgs222-tabella-a}]
    status: verified

