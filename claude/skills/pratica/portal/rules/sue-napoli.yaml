  - id: paesaggistica-semplificata
    when:
      intervento: [opere_temporanee, nessuna_opera, edilizia_libera, manutenzione_straordinaria, restauro, ristrutturazione, ristrutturazione_pesante, nuova_costruzione, ristrutturazione_urbanistica, variante_pdc, variante_essenziale_pdc, variante_scia]
      paesaggio: [semplificata]
    then:
      role: also
      procedure: napoli/comune/autorizzazione-paesaggistica-semplificata
      regime: autorizzazione
      portal: {settore: "Edilizia e pianificazione urbana", operazione: "Autorizzazione paesaggistica semplificata (DPR 31/2017 - Comune)"}
    cites:
      - {procedure: napoli/comune/autorizzazione-paesaggistica-semplificata, source: dpr31-art3}
