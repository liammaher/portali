# What goes in each field of the impresainungiorno front office (fnsuap: the SUAP and the SUE),
# by section and label, for gen.py. A section here serves every pratica that has it: the CILA,
# the SCIA and the fine lavori share the Scheda anagrafica, the procuratore, the domicilio and
# the diritti. Ids are not here: they come from each pratica's crawl (catalogue/<comune>/sections).
#
# A field: kind and label (the start of one of its first texts on the page: its own cell, the
# row above, the cell to its left, as inpage.js reads them), `nth` when several share the label,
# the value (vault fields by role, {{ask.x}} for pre-flight's questions) and `when`. A radio or a
# checkbox listed is ticked, and what it opens is found in the crawl. `via: <option>` is a field
# a templated dropdown opens only on that option (its `when` says when). `leave:` names what the
# section shows that stays empty; `omit:` a section that is the person's alone. `kind: tick`
# is a radio in one pratica and a checkbox in another; `if_present` a field only some pratiche
# show; `on_page` one the crawl can't see (shown by two choices together), found by label on
# the page; `anchor`/`block` a field inside the block that starts at another field.
#
# Roles (answers.json "people"): no prefix and `t:` are the studio's own (the business and its
# titolare, the architect), `c:` the client, `o:` the owner company, `r:` its legale
# rappresentante, `f1:`/`f2:` the firms.

# Yes/no asks with a `group` are asked as one checklist (`item`), the answer the list of
# items that apply.
groups:
  attivita_852:
    question: "What does the food business do? Tick every line that applies."
  allegato_b:
    question: "Which items of DPR 31/2017's Allegato B do the works fall under? Tick every one that applies."

