      - {kind: checkbox, label: Da compilare solo nel caso in cui il titolare sia, when: "{{ask.titolo_esclusivo|not}} {{o:business.denominazione|empty|not}}"}
      - {kind: text, label: in qualità di, value: legale rappresentante, when: "{{ask.titolo_esclusivo|not}} {{o:business.denominazione|empty|not}}"}
      - {kind: text, label: della ditta / società, value: "{{o:business.denominazione}}", when: "{{ask.titolo_esclusivo|not}} {{o:business.denominazione|empty|not}}"}
      - {kind: text, label: con codice fiscale / p. IVA, value: "{{o:business.partita_iva}}", when: "{{ask.titolo_esclusivo|not}} {{o:business.denominazione|empty|not}}"}

  - section: b) Opere su parti comuni
    fields:
