      - {kind: text, label: Scadenza, value: "{{ask.paes_scadenza|date_it}}"}
      - {kind: text, label: Ente, value: "{{ask.paes_ente}}"}
      - {kind: radio, label: "L'istanza di rinnovo riguarda Autorizzazione Paesaggistica Semplificata", when: "{{ask.paes_rinnovo_di|is_semplificata}}"}
      - {kind: radio, label: "L'istanza di rinnovo riguarda l'Autorizzazione Paesaggistica, rilasciata ai sensi dell'articolo 146", when: "{{ask.paes_rinnovo_di|is_ordinaria}}"}

  # Voltura of a permesso di costruire to a new holder (the client, `c:`): the permit and its
  # holder until now, the deed that passed the property, the property, where the new holder
  # takes notices. Their acknowledgements, and their promise to pay what's left of the
  # contributo, are theirs.
  - section: Numero del permesso di costruire e proprietario
    fields:
      - {kind: text, label: numero, value: "{{ask.pdc_numero}}"}
      - {kind: date, label: di data, value: "{{ask.pdc_data|date_it}}"}
      - {kind: text, label: cognome / ragione sociale, value: "{{ask.precedente_cognome}}"}
      - {kind: text, label: nome, value: "{{ask.precedente_nome}}", optional: true}
      - {kind: text, label: codice fiscale / P. IVA, value: "{{ask.precedente_cf}}"}
