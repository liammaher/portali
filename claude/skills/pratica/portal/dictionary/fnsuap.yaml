# What goes in each field of the impresainungiorno front office (fnsuap: the SUAP and the SUE),
# by section and label, for gen.py. A section here serves every pratica that has it: the CILA,
# the SCIA and the fine lavori share the Scheda anagrafica, the procuratore, the domicilio and
# the diritti. Ids are not here: they come from each pratica's crawl (catalogue/<comune>/sections).
#
# A field: kind and label (the start of one of its first texts on the page: its own cell, the
# row above, the cell to its left, as inpage.js reads them), `nth` when several share the label,
# the value (vault fields by role, {{ask.x}} for pre-flight's questions) and `when`; an entry's
# `branches` repeats its boxes once per condition of a first choice that renumbers them. A radio or a
# checkbox listed is ticked, and what it opens is found in the crawl. `via: <option>` is a field
# a templated dropdown opens only on that option (its `when` says when). `leave:` names what the
# section shows that stays empty; `omit:` a section that is the person's alone. `kind: tick`
# is a radio in one pratica and a checkbox in another; `if_present` a field only some pratiche
# show; `on_page` one the crawl can't see (shown by two choices together), found by label on
# the page; `anchor`/`block` a field inside the block that starts at another field. A `when`'s
# words gate each other in order: pre-flight asks a later one only once the earlier hold.
# A `when` has no "or": `|in_<a>__<b>` is true for any of those answers.
# An ask's `default` answers it silently: only where no answer can be a wrong statement (a
# blank optional date, the bollo's payment method, Napoli's own constants). A fact of the case,
# however usual, is `propose`d: pre-flight shows it for the person to confirm.
#
# Roles (answers.json "people"): no prefix and `t:` are the studio's own (the business and its
# titolare, the architect), `c:` the client, `o:` the owner company, `r:` its legale
# rappresentante, `f1:`/`f2:` the firms.

# Yes/no asks with a `group` are asked as one checklist (`item`), the answer the list of
# items that apply.
groups:
  audiovisivi:
    question: "What will it do with films or music on discs or tapes? Tick every line that applies."
  alcolici:
    question: "Which alcoholic products will it sell? Tick every line that applies."
  variazioni:
    question: "What changed? Tick every line that applies."
  attivita_852:
    question: "What does the food business do? Tick every line that applies."
  allegato_b:
    question: "Which items of DPR 31/2017's Allegato B do the works fall under? Tick every one that applies."
  cila_interventi:
    question: "What are the works, for the CILA's relazione tecnica? Tick every line that applies."
  tolleranze_tipi:
    question: "Which construction tolerances does the relazione declare? Tick every one that applies."
  fasce_funzionali:
    question: "Which fasce di rispetto is the property in? Tick every one that applies."
  barriere_requisiti:
    question: "Which of the barriers rules' requirements does the project meet (D.M. 236/1989)? Tick every one that applies."

asks:
  descrizione:
    type: text
    question: "A name for the draft in Pratiche in bozza"
    default: "PROVA NON INVIARE - {{c:identity.last_name}}"
  titolo:
    type: text
    question: "The client's title to the property, in one word (proprietario, comproprietario, usufruttuario, amministratore di condominio, locatario, comodatario, ...)"
    propose: "{{c:immobile.titolo}}"
  # Whether anyone else's assent is needed (a.1 or a.2): an owner usually holds it alone, a
  # tenant or a co-owner doesn't.
  titolo_esclusivo:
    type: yes_no
    question: "Does the client hold the title alone, with no one else (co-owners, the landlord) whose assent the works need? If not, the other holder is the job's `r:` person, with `o:` their company if a company owns it"
    propose: "{{ask.titolo|titolo_solo}}"
  parti_comuni:
    type: choice
    question: "Do the works touch common parts of the building? nessuna; condominio (common parts of a condominium); comproprieta (a building of several owners that isn't a condominium, with their approval); art 1102 (common parts used at the client's expense without changing their purpose, art. 1102 c.c.: no assent needed)"
    options: [nessuna, condominio, comproprieta, art 1102]
    propose: "nessuna"
  # The CILA's quadro d: works to start (d.1), under way (d.2, 333 € penalty) or done (d.3,
  # 1,000 €): art. 6-bis c. 5 DPR 380/2001.
  cila_stato:
    type: choice
    question: "Have the works started? da iniziare (not yet); in corso (under way: a late CILA with the 333 € penalty); realizzato (already finished: the 1,000 € penalty)"
    options: [da iniziare, in corso, realizzato]
  inizio_dopo_assensi:
    type: yes_no
    question: "Will the works start only once the SUE says the other assents (e.g. the landscape authorization) are in, rather than on a set date?"
    propose: "false"
  data_lavori_realizzati: {type: date, question: "When the works were finished (a CILA for works already done, d.3)"}
  cila_onerosa:
    type: yes_no
    question: "Is a contributo di costruzione due (manutenzione straordinaria that adds urban load and floor area)?"
    propose: "false"
  contributo_pagato: {type: yes_no, question: "Is the contributo already paid (its receipt attached), rather than to be paid before the works start?"}
  ricevuta_contributo: {type: file, question: "The contributo di costruzione's payment receipt (PDF)"}
  prospetto_contributo: {type: file, question: "The prospetto di calcolo preventivo of the contributo di costruzione (PDF)"}
  direttore_lavori:
    type: choice
    question: "Who directs the works? progettista (the architect filing the pratica); da nominare (no direttore dei lavori named in the CILA); altro tecnico (another technician)"
    options: [progettista, da nominare, altro tecnico]
    propose: "progettista"
  altri_tecnici:
    type: yes_no
    question: "Are other technicians (structures, systems, acoustics, safety) already appointed for these works?"
    propose: "false"
  lavori_in_proprio:
    type: yes_no
    question: "Are the works so minor that the client does them without a firm (opere di modesta entità, eseguite in proprio)?"
    propose: "false"
  # The CILA's relazione tecnica: what the works are (art. 6-bis DPR 380/2001 and Tabella A of
  # D.Lgs. 222/2016), the progettista's to say.
  cila_manutenzione: {type: yes_no, group: cila_interventi, item: "Manutenzione straordinaria (art. 3 c.1 b DPR 380/2001), not touching the structure"}
  cila_restauro: {type: yes_no, group: cila_interventi, item: "Restauro e risanamento conservativo (art. 3 c.1 c), not touching the structure"}
  cila_barriere: {type: yes_no, group: cila_interventi, item: "Removing architectural barriers with external lifts or works that change the building's shape"}
  cila_sottosuolo: {type: yes_no, group: cila_interventi, item: "Temporary geognostic surveys of the subsoil"}
  cila_terra: {type: yes_no, group: cila_interventi, item: "Earth moving not for farming"}
  cila_serre: {type: yes_no, group: cila_interventi, item: "Seasonal farm greenhouses with masonry parts"}
  cila_pertinenze: {type: yes_no, group: cila_interventi, item: "Minor pertinenze the PRG doesn't count as new building"}
  cila_altri: {type: yes_no, group: cila_interventi, item: "Other works not listed in artt. 6, 10 and 22 DPR 380/2001 (residual CILA)"}
  cila_altri_tipo: {type: text, question: "Which other works (the 'specificare il tipo di intervento' line)"}
  # Construction tolerances (art. 34-bis and 34-ter DPR 380/2001, as the 2024 Salva Casa changed them).
  tolleranze:
    type: yes_no
    question: "Does the relazione declare construction tolerances (art. 34-bis / 34-ter DPR 380/2001) on the property?"
    propose: "false"
  toll_34bis_1: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 1 and 1-ter, second period (2% of the measures)"}
  toll_34bis_1bis: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 1-bis and 1-ter, first period (2–6% by the unit's floor area, works before 24 May 2024)"}
  toll_34bis_2: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 2 (geometric and execution irregularities)"}
  toll_34bis_2bis: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-bis c. 2-bis (works before 24 May 2024: minor execution irregularities)"}
  toll_34ter_4: {type: yes_no, group: tolleranze_tipi, item: "Art. 34-ter c. 4 (variants made during works before 1977)"}
  toll_superficie:
    type: choice
    question: "The unit's superficie utile, for the art. 34-bis c. 1-bis tolerance: oltre 500 (over 500 m², 2%); 300-500 (3%); 100-300 (4%); 60-100 (5%); sotto 60 (under 60 m², 6%)"
    options: [oltre 500, 300-500, 100-300, 60-100, sotto 60]
  toll_strutturale: {type: yes_no, question: "Is the tolerance structurally relevant (it then complies with the technical rules for construction)?"}
  altri_atti:
    type: yes_no
    question: "Do the works need other filings or assents that this pratica doesn't file (the Soprintendenza, ASL, fire brigade, a landscape authorization not in this pratica)?"
    propose: "false"
  oggetto:
    type: text
    question: "The works in one sentence (300 characters)"
  data_inizio_lavori: {type: date, question: "When the works start, or started"}
  ricevuta_sanzione: {type: file, question: "The penalty receipt (PDF): 333 € for works under way, 1,000 € for works already done"}
  dettaglio_intervento:
    type: text
    question: "The works for the relazione tecnica (500 characters)"
  dlgs81: {type: yes_no, question: "Do the D.Lgs. 81/2008 site-safety rules apply (works by a firm, not a self-builder)?", propose: "true"}
  sotto_200: {type: yes_no, question: "Is the site under 200 uomini-giorno?", propose: "true"}
  notifica_dovuta: {type: yes_no, question: "Is a notifica preliminare due (more than one firm on site, or over 200 uomini-giorno)?"}
  verificato_idoneita: {type: yes_no, question: "Has the client checked the firms' documents (DURC and technical suitability, art. 90 c. 9 D.Lgs. 81/2008)?"}
  data_fine_prevista: {type: date, question: "When the works will end (temporary works: within 180 days)"}
  pdc_numero: {type: text, question: "The permesso di costruire's number"}
  pdc_data: {type: date, question: "Its issue date"}
  pdc_protocollo: {type: text, question: "Its protocollo generale number"}
  pdc_anno: {type: text, question: "Its protocollo generale year"}
  pdc_interventi: {type: text, question: "What it permits, in a few words (per interventi di ...)"}
  fine_presentata: {type: yes_no, question: "Was the comunicazione di fine lavori already filed?"}
  titolo_tipo:
    type: choice
    question: "The works' title: what was filed or issued"
    options: [permesso di costruire, SCIA, DIA, CILA, variante, autorizzazione paesaggistica]
    propose: permesso di costruire
  titolo_id_pratica: {type: text, question: "The title's pratica number on the SUAP/SUE (ID pratica)"}
  data_nomina: {type: date, question: "From when the new direttore dei lavori takes over"}
  nomina_aggiunta: {type: yes_no, question: "Is the firm named alongside an earlier one (rather than the first named)?", propose: "false"}
  paes_protocollo: {type: text, question: "The landscape authorization's P.G. (protocollo) number"}
  paes_data: {type: date, question: "Its date"}
  paes_scadenza: {type: date, question: "The date it was to stop being valid"}
  # The autorizzazione paesaggistica semplificata (DPR 31/2017): the protection the property
  # is under (art. 136: a declaration by D.M. or D.G.R.; art. 142: by law, e.g. the coast) and
  # what the works are in the decree's Allegato B, the architect's to say.
  vincolo:
    type: choice
    question: "What protects the property's landscape? (art. 136: a declaration by D.M./D.G.R.; art. 142: by law, e.g. the coast; art. 134: the piano paesaggistico only)"
    options: [art 136, art 142, art 136 and 142, art 134]
  vincolo_136_lettera: {type: text, question: "Which letter(s) of art. 136 c.1 (a, b, c, d)?"}
  vincolo_136_provvedimento: {type: text, question: "The D.M. or D.G.R. that declared it (e.g. D.M. 28/03/1985)"}
  vincolo_142_lettera: {type: text, question: "Which letter(s) of art. 142 c.1 (a: coast within 300 m, c: rivers, f: parks, g: woods, m: archaeological)?"}
  paes_variante: {type: yes_no, question: "Is this a variant of a landscape authorization already issued?", propose: "false"}
  paes_b1: {type: yes_no, group: allegato_b, item: "B.1 Volume increase up to 10% of the original building, and at most 100 m³"}
  paes_b2: {type: yes_no, group: allegato_b, item: "B.2 New or changed external openings or roof windows on buildings protected under art. 136 c.1 a), b), c)"}
  paes_b3: {type: yes_no, group: allegato_b, item: "B.3 Facade changes that alter the building's look (other than B.2)"}
  paes_b4: {type: yes_no, group: allegato_b, item: "B.4 Roof changes that alter the building's look (other than B.2)"}
  paes_b5: {type: yes_no, group: allegato_b, item: "B.5 Seismic or energy-saving upgrades that change the building's look"}
  paes_b6: {type: yes_no, group: allegato_b, item: "B.6 Accessibility works: ramps over 60 cm, external lifts or volumes visible from outside"}
  paes_b7: {type: yes_no, group: allegato_b, item: "B.7 External plant serving one building: air-conditioning units, boilers, tanks and the like"}
  paes_b8: {type: yes_no, group: allegato_b, item: "B.8 Solar panels (thermal or photovoltaic) serving one building"}
  paes_b9: {type: yes_no, group: allegato_b, item: "B.9 Micro wind turbines up to 1.50 m high and 1.00 m across"}
  paes_b10: {type: yes_no, group: allegato_b, item: "B.10 Cabins or modular columns for network utilities, or replacing them with different ones"}
  paes_b11: {type: yes_no, group: allegato_b, item: "B.11 Local road changes: roundabouts, junctions, lay-bys, pavements"}
  paes_b12: {type: yes_no, group: allegato_b, item: "B.12 Systematic street furniture, public lighting included"}
  paes_b13: {type: yes_no, group: allegato_b, item: "B.13 Primary urbanisation works in implementation plans already assessed for landscape"}
  paes_b14: {type: yes_no, group: allegato_b, item: "B.14 Works of item A.12 (Allegato A) in a protected building's grounds"}
  paes_b15: {type: yes_no, group: allegato_b, item: "B.15 Demolition without rebuilding of buildings with no architectural, historic or witness value"}
  paes_b16: {type: yes_no, group: allegato_b, item: "B.16 Garages above ground or partly underground, up to 50 m³ above ground"}
  paes_b17: {type: yes_no, group: allegato_b, item: "B.17 Permanent canopies, porticoes, garden kiosks open on several sides, of limited size"}
  paes_b18: {type: yes_no, group: allegato_b, item: "B.18 Systematic layout of a building's grounds: new paving, ramps, steps (other than B.14)"}
  paes_b19: {type: yes_no, group: allegato_b, item: "B.19 Open canopies serving production sheds, or linking them"}
  paes_b20: {type: yes_no, group: allegato_b, item: "B.20 External plant for existing production buildings: storage, ducts and the like"}
  paes_b21: {type: yes_no, group: allegato_b, item: "B.21 Gates, fences, boundary or retaining walls, anti-intrusion elements"}
  paes_b22: {type: yes_no, group: allegato_b, item: "B.22 Felling trees without replacement; replacing or planting trees and shrubs"}
  paes_b23: {type: yes_no, group: allegato_b, item: "B.23 Above-ground works for local utility networks or sewers"}
  paes_b24: {type: yes_no, group: allegato_b, item: "B.24 Underground tanks and cisterns that permanently change the ground"}
  paes_b25: {type: yes_no, group: allegato_b, item: "B.25 Temporary occupation of land with structures simply anchored to the ground"}
  paes_b26: {type: yes_no, group: allegato_b, item: "B.26 Verandas and closed outdoor structures (dehors) for businesses such as bars and restaurants"}
  paes_b27: {type: yes_no, group: allegato_b, item: "B.27 Above-ground structures for domestic wells and water intakes"}
  paes_b28: {type: yes_no, group: allegato_b, item: "B.28 Small bridges over watercourses, or partly covering them, to give access"}
  paes_b29: {type: yes_no, group: allegato_b, item: "B.29 Masonry shelters for farm tools, up to 10 m²"}
  paes_b30: {type: yes_no, group: allegato_b, item: "B.30 New fishing structures up to 30 m²"}
  paes_b31: {type: yes_no, group: allegato_b, item: "B.31 Upgrading local and farm roads"}
  paes_b32: {type: yes_no, group: allegato_b, item: "B.32 Restoring farming or grazing on rural land overgrown by scrub or woodland"}
  paes_b33: {type: yes_no, group: allegato_b, item: "B.33 Thinning woodland to bring in clearing crops"}
  paes_b34: {type: yes_no, group: allegato_b, item: "B.34 Reducing woodland in an existing building's grounds, up to 2,000 m²"}
  paes_b35: {type: yes_no, group: allegato_b, item: "B.35 Forest roads where no regional forest plan is approved"}
  paes_b36: {type: yes_no, group: allegato_b, item: "B.36 Permanent signs and advertising under 18 m² (art. 153 c.1)"}
  paes_b37: {type: yes_no, group: allegato_b, item: "B.37 Electricity and telephone lines on poles for single users"}
  paes_b38: {type: yes_no, group: allegato_b, item: "B.38 Electronic communication or radio installations (other than the exempt ones)"}
  paes_b39: {type: yes_no, group: allegato_b, item: "B.39 Changes to flood defences on river and lake banks"}
  paes_b40: {type: yes_no, group: allegato_b, item: "B.40 Systematic natural-engineering works for water, soil or landslide protection"}
  paes_b41: {type: yes_no, group: allegato_b, item: "B.41 Demolition and rebuilding with the same volume, shape and footprint"}
  paes_b42: {type: yes_no, group: allegato_b, item: "B.42 Beach nourishment, artificial dunes, restoring coastal works"}
  precedente_cognome: {type: text, question: "The permit's holder until now: surname, or the company's name"}
  precedente_nome: {type: text, question: "Their first name (none for a company)", default: ""}
  precedente_cf: {type: text, question: "Their codice fiscale or partita IVA"}
  atto_tipo: {type: text, question: "The deed that passed the property (e.g. atto di compravendita)"}
  atto_data: {type: date, question: "Its date"}
  atto_notaio: {type: text, question: "The notary's name"}
  atto_notaio_sede: {type: text, question: "The notary's town"}
  atto_repertorio: {type: text, question: "Repertorio number"}
  atto_raccolta: {type: text, question: "Raccolta (rogito) number"}
  atto_registrato_a: {type: text, question: "Where it was registered (Agenzia delle Entrate office)"}
  atto_registrazione_data: {type: date, question: "Registration date"}
  atto_registrazione_numero: {type: text, question: "Registration number"}
  zona_prg: {type: text, question: "The property's zone in the PRG (e.g. zona B)"}
  prg_nta: {type: text, question: "The article of the PRG's NTA for that zone (e.g. art. 33)"}
  proprietario_nome: {type: text, question: "The owner's name or company (the client holds another real right)"}
  titolo_atto:
    type: choice
    question: "What proves the client's title: a notarial deed (rogito), a contract registered at the Agenzia delle Entrate, or one transcribed at the Conservatoria?"
    options: [rogito, agenzia entrate, conservatoria]
  atto_trascrizione_sede: {type: text, question: "The Conservatoria (servizio di pubblicità immobiliare) it was transcribed at"}
  atto_trascrizione_numero: {type: text, question: "Its registro generale number"}
  atto_trascrizione_data: {type: date, question: "Its transcription date"}
  paes_interessa:
    type: choice
    question: "Do the works concern a building or an area (land with no building)?"
    options: [immobile, area]
    propose: immobile
  atti_gravanti: {type: yes_no, question: "Do registered deeds weigh on the property: servitudes, atti unilaterali d'obbligo, convenzioni?", propose: "false"}
  atti_gravanti_quali: {type: text, question: "Which deed(s), as the deed names them"}
  paes_ente: {type: text, question: "The ente that issued the landscape authorization", default: "Comune di Napoli"}
  paes_rinnovo_di:
    type: choice
    question: "What is being renewed: a semplificata (DPR 31/2017) or an ordinaria (art. 146 D.Lgs. 42/2004)?"
    options: [semplificata, ordinaria]
  paes_rinnovo_variazioni: {type: yes_no, question: "Does the renewal change the project?", propose: "false"}
  attivita_svolta: {type: text, question: "The new holder's occupation or business (60 characters)"}
  soggetti_cambiati: {type: yes_no, question: "Will the works' direttore or firm change with the new holder?", propose: "false"}
  nuovo_dl: {type: text, question: "The new direttore dei lavori's name"}
  nuovo_esecutore: {type: text, question: "The new firm's name"}
  nuovo_csp: {type: text, question: "The new coordinatore per la sicurezza's name (none: empty)", default: ""}
  proroga_giorni: {type: text, question: "How many days of extension are asked (e.g. 365)"}
  proroga_motivo: {type: text, question: "Why the extension is needed: the facts beyond the holder's control (500 characters)"}
  proroga_tipo_lavori: {type: text, question: "The works still to finish, in a few words (30 characters)"}
