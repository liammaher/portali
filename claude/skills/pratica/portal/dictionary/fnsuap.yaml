  temporary_al: {type: date, question: "Its last day"}

  superficie_somministrazione_prima_mq: {type: number, question: "The customer area before the change, in m²"}
  titolo_attivita_comune: {type: text, question: "The comune the title was filed with", propose: "Napoli"}

  orario_dalle: {type: text, question: "Opening time, the same every open day (hh:mm)"}
