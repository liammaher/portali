  paes_b3: {type: yes_no, group: allegato_b, item: "B.3 Facade changes that alter the building's look (other than B.2)"}
  paes_b4: {type: yes_no, group: allegato_b, item: "B.4 Roof changes that alter the building's look (other than B.2)"}
  paes_b5: {type: yes_no, group: allegato_b, item: "B.5 Seismic or energy-saving upgrades that change the building's look"}
  paes_b6: {type: yes_no, group: allegato_b, item: "B.6 Accessibility works: ramps over 60 cm, external lifts or volumes visible from outside"}
  paes_b7: {type: yes_no, group: allegato_b, item: "B.7 External plant serving one building: air-conditioning units, boilers, tanks and the like"}
  paes_b8: {type: yes_no, group: allegato_b, item: "B.8 Solar panels (thermal or photovoltaic) serving one building"}
  paes_b9: {type: yes_no, group: allegato_b, item: "B.9 Micro wind turbines up to 1.50 m high and 1.00 m across"}
  paes_b10: {type: yes_no, group: allegato_b, item: "B.10 Cabins or modular columns for network utilities, or replacing them with different ones"}
  paes_b11: {type: yes_no, group: allegato_b, item: "B.11 Local road changes: roundabouts, junctions, lay-bys, pavements"}
  paes_b12: {type: yes_no, group: allegato_b, item: "B.12 Systematic street furniture, public lighting included"}
  paes_b13: {type: yes_no, group: allegato_b, item: "B.13 Primary urbanisation works in implementation plans already assessed for landscape"}
  paes_b14: {type: yes_no, group: allegato_b, item: "B.14 Works of item A.12 (Allegato A) in a protected building's grounds"}
  paes_b15: {type: yes_no, group: allegato_b, item: "B.15 Demolition without rebuilding of buildings with no architectural, historic or witness value"}
  paes_b16: {type: yes_no, group: allegato_b, item: "B.16 Garages above ground or partly underground, up to 50 m³ above ground"}
  paes_b17: {type: yes_no, group: allegato_b, item: "B.17 Permanent canopies, porticoes, garden kiosks open on several sides, of limited size"}
  paes_b18: {type: yes_no, group: allegato_b, item: "B.18 Systematic layout of a building's grounds: new paving, ramps, steps (other than B.14)"}
