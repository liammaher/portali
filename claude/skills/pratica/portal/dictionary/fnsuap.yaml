  # Ticking art. 136 opens its letter and the declaring D.M. and moves the boxes below, so the
  # protection is one answer: each branch ticks its boxes in page order, then fills what they opened.
  - section: Ambito dell'intervento
    fields:
      - {kind: checkbox, label: "dell'art. 136", when: "{{ask.vincolo|is_art_136}}"}
      - {kind: text, label: "dell'art. 136", value: "{{ask.vincolo_136_lettera}}", when: "{{ask.vincolo|is_art_136}}"}
      - {kind: text, label: Citare estremi del provvedimento, value: "{{ask.vincolo_136_provvedimento}}", when: "{{ask.vincolo|is_art_136}}"}
      - {kind: checkbox, label: "dell'art. 142", when: "{{ask.vincolo|is_art_142}}"}
