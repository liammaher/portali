      - {kind: checkbox, label: "B.34.", when: "{{ask.paes_b34}}"}
      - {kind: checkbox, label: "B.35.", when: "{{ask.paes_b35}}"}
      - {kind: checkbox, label: "B.36.", when: "{{ask.paes_b36}}"}
      - {kind: checkbox, label: "B.37.", when: "{{ask.paes_b37}}"}
