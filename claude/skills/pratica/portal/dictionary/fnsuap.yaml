      - {kind: checkbox, label: "B.17.", when: "{{ask.paes_b17}}"}
      - {kind: checkbox, label: "B.18.", when: "{{ask.paes_b18}}"}
      - {kind: checkbox, label: "B.19.", when: "{{ask.paes_b19}}"}
      - {kind: checkbox, label: "B.20.", when: "{{ask.paes_b20}}"}
      - {kind: checkbox, label: "B.21.", when: "{{ask.paes_b21}}"}
      - {kind: checkbox, label: "B.22.", when: "{{ask.paes_b22}}"}
      - {kind: checkbox, label: "B.23.", when: "{{ask.paes_b23}}"}
      - {kind: checkbox, label: "B.24.", when: "{{ask.paes_b24}}"}
      - {kind: checkbox, label: "B.25.", when: "{{ask.paes_b25}}"}
      - {kind: checkbox, label: "B.26.", when: "{{ask.paes_b26}}"}
