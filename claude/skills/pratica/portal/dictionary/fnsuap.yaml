      - {kind: checkbox, label: "B.28.", when: "{{ask.paes_b28}}"}
      - {kind: checkbox, label: "B.29.", when: "{{ask.paes_b29}}"}
      - {kind: checkbox, label: "B.30.", when: "{{ask.paes_b30}}"}
      - {kind: checkbox, label: "B.31.", when: "{{ask.paes_b31}}"}
      - {kind: checkbox, label: "B.32.", when: "{{ask.paes_b32}}"}
