      - {kind: checkbox, label: idrici e sanitari, when: "{{ask.impianti}} {{ask.impianto_idrico}}"}
      - {kind: checkbox, label: per la distribuzione e l'utilizzazione di gas, when: "{{ask.impianti}} {{ask.impianto_gas}}"}
