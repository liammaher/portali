  alcol_altre_bevande: {type: yes_no, group: alcolici, item: "Other alcoholic drinks"}
  alcol_puro: {type: yes_no, group: alcolici, item: "Pure ethyl alcohol"}
  alcol_aromi: {type: yes_no, group: alcolici, item: "Alcoholic flavourings"}
  alcol_profumeria: {type: yes_no, group: alcolici, item: "Alcohol-based perfumery"}
