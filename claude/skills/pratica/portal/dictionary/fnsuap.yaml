  # The SCIA edilizia's quadro c) and the asseverazione's tipologia: works of art. 22 c. 1 a)
  # to c), a variant in corso d'opera, or a change of use (art. 23-ter, as the 2024 Salva Casa
  # changed it).
  scia_tipo:
    type: choice
    question: "What does the SCIA file? manutenzione straordinaria (art. 3 c. 1 b: on structural parts or the facades); restauro (c: restauro e risanamento conservativo on structural parts); ristrutturazione (d: a ristrutturazione edilizia that isn't one of art. 10 c. 1 c); variante pdc (a variant in corso d'opera to a permesso di costruire, art. 22 c. 2 and 2-bis); variante scia (a variant to a SCIA that isn't an essential variation); variante scia essenziale (one that is, art. 32); cambio uso (a change of use alone, art. 23-ter)"
    options: [manutenzione straordinaria, restauro, ristrutturazione, variante pdc, variante scia, variante scia essenziale, cambio uso]
    # From the SUE rules table's answers (rules/sue-napoli.yaml), for the person to confirm.
    propose: "{{ask.intervento,ask.strutture,ask.prospetti,ask.cambio_uso|sue_scia_tipo}}"
  scia_cambio_uso:
    type: choice
    question: "Do the works change the use? no; stessa categoria (one unit, within the same functional category); tra categorie (one unit in a building in zone A, B or C of DM 1444/1968, to another category: art. 23-ter c. 1-ter); intero immobile (a whole building, within the same category: art. 23-ter c. 3)"
    options: ["no", stessa categoria, tra categorie, intero immobile]
    propose: "{{ask.cambio_uso|sue_scia_cambio_uso}}"
  cambio_uso_tipo:
    type: choice
    question: "Which change of use, alone? unita senza opere stessa categoria / unita senza opere tra categorie (one unit, with no works or only edilizia libera, art. 6); unita opere 6bis stessa categoria / unita opere 6bis tra categorie (one unit, with CILA works, art. 6-bis); immobile senza opere / immobile opere 6bis (a whole building, within the same category)"
    options: [unita senza opere stessa categoria, unita senza opere tra categorie, unita opere 6bis stessa categoria, unita opere 6bis tra categorie, immobile senza opere, immobile opere 6bis]
    propose: "{{ask.intervento,ask.cambio_uso|sue_cambio_uso_tipo}}"
  # The permesso di costruire (art. 10 DPR 380/2001) and the SCIA alternativa to it (art. 23):
  # what they file, in quadro a) / c) and the progettista's asseverazione.
  pdc_tipo:
    type: choice
    question: "What does the permesso di costruire ask for? nuova costruzione (art. 3 c. 1 e); ristrutturazione urbanistica (f); ristrutturazione edilizia (one of art. 10 c. 1 c: a different building with more volume, a change of use in zone A, or new shape, volume or facades on a protected building); facolta scia (works a SCIA could file, asked as a permesso by choice, art. 22 c. 7); variante essenziale (a variant in corso d'opera to a permesso that is an essential variation)"
    options: [nuova costruzione, ristrutturazione urbanistica, ristrutturazione edilizia, facolta scia, variante essenziale]
    propose: "{{ask.intervento,ask.cambio_uso,ask.demolizione_zona_a|sue_pdc_tipo}}"
  scia_alt_tipo:
    type: choice
    question: "Which works does the SCIA alternativa al permesso file (art. 23 c. 1 DPR 380/2001)? ristrutturazione edilizia (one of art. 10 c. 1 c); nuova costruzione piano attuativo (new building or ristrutturazione urbanistica under a piano attuativo with precise plano-volumetric rules); nuova costruzione strumento generale (new building directly under the town plan's precise plano-volumetric rules)"
    options: [ristrutturazione edilizia, nuova costruzione piano attuativo, nuova costruzione strumento generale]
    propose: "{{ask.intervento|sue_scia_alt_tipo}}"
  intervento_tipo: {type: text, question: "The works' type as the relazione tecnico-illustrativa names it (one line)"}
