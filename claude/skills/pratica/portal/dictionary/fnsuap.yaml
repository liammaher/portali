      - {kind: date, label: del, value: "{{ask.notifica_852_data|date_it}}"}
      - {kind: date, label: cesserà in data, value: "{{ask.cessazione_852_data|date_it}}"}

  # A bar or restaurant (somministrazione di alimenti e bevande): the sign, the season, what
  # kind of place, a shopping centre, the area where customers eat and drink. Drafted by
  # draft.py from mod_somministrazione_zone_non_tutelate_apertura, checked against the
  # pizzeria walk (rehearsals/pizzeria-fittizia).
  - section: Dati dell'esercizio di somministrazione
    fields:
      - {kind: text, label: Denominazione insegna, value: "{{ask.insegna}}"}
      - {kind: radio, label: Permanente, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
      - {kind: text, label: dal (gg/mm), value: "{{ask.stagione_dal}}", when: "{{ask.stagionale}}"}
      - {kind: text, label: al (gg/mm), value: "{{ask.stagione_al}}", when: "{{ask.stagionale}}"}
      - {kind: textarea, label: Tipologia di esercizio, value: "{{business.descrizione_attivita}}"}
      # The protected zones' authorization has no shopping-centre question.
      - {kind: radio, label: Si, when: "{{ask.in_centro_commerciale}}", if_present: true}
      - {kind: radio, label: "No", when: "{{ask.in_centro_commerciale|not}}", if_present: true}
      - {kind: text, label: denominazione, nth: 2, value: "{{ask.centro_commerciale_denominazione}}", when: "{{ask.in_centro_commerciale}}", if_present: true}
      - {kind: text, label: Superficie di somministrazione, value: "{{ask.superficie_somministrazione_mq}}"}

  # The Reg. 852/2004 notifica (mod_notifica_sanitaria): when the activity starts, and if it
  # ends on a date (a temporary one).
  - section: notifica avvio e inizio attività
    aliases: [inizio dell'attività]
    fields:
      - {kind: radio, label: Avvio contestuale alla data di notifica, when: "{{ask.avvio_data|empty}}"}
      - {kind: radio, label: Avvio con decorrenza, when: "{{ask.avvio_data|empty|not}}"}
      - {kind: date, label: dal, value: "{{ask.avvio_data|date_it}}", when: "{{ask.avvio_data|empty|not}}"}
      - {kind: checkbox, label: Termine dell'attività, when: "{{ask.termine_data|empty|not}}"}
      - {kind: date, label: in data, value: "{{ask.termine_data|date_it}}", when: "{{ask.termine_data|empty|not}}"}

  # What the food business does, in the notifica's master list: the food-service block (a bar,
  # a restaurant), the bakery and pastry block, and food retail in a shop; a heading opens its
  # lines. The other blocks stay unticked.
  - section: tipologia di attività ai sensi dell'art. 6
    fields:
      - {kind: checkbox, label: "RISTORAZIONE:", when: "{{ask.ristorazione}}"}
      - {kind: checkbox, label: Produzione pasti pronti per ristorazione collettiva, when: "{{ask.ristorazione}} {{ask.pasti_collettiva}}"}
      - {kind: checkbox, label: Somministrazione pasti in ristorazione collettiva, when: "{{ask.ristorazione}} {{ask.mensa}}"}
      - {kind: checkbox, label: Ristorazione pubblica con somministrazione diretta, when: "{{ask.ristorazione}} {{ask.ristorante}}"}
      - {kind: checkbox, label: Bar e altri esercizi pubblici simili senza laboratorio, when: "{{ask.ristorazione}} {{ask.bar}}"}
      - {kind: checkbox, label: Bar e altri esercizi pubblici simili con laboratorio, when: "{{ask.ristorazione}} {{ask.bar_laboratorio}}"}
      - {kind: checkbox, label: Ristorazione pubblica in ambito di manifestazioni, when: "{{ask.ristorazione}} {{ask.manifestazioni}}"}
      - {kind: checkbox, label: Home restaurant, when: "{{ask.ristorazione}} {{ask.home_restaurant}}"}
      - {kind: checkbox, label: "PRODOTTI DA FORNO E DI PASTICCERIA", when: "{{ask.forno}}"}
      - {kind: checkbox, label: "Pane, pizza e altri prodotti da forno", when: "{{ask.forno}} {{ask.pane}}"}
      - {kind: checkbox, label: Prodotti di pasticceria freschi e secchi, when: "{{ask.forno}} {{ask.pasticceria}}"}
      - {kind: checkbox, label: Prodotti di gelateria, when: "{{ask.forno}} {{ask.gelateria}}"}
      - {kind: checkbox, label: Cibi pronti in genere, when: "{{ask.forno}} {{ask.gastronomia}}"}
      - {kind: checkbox, label: Pasta secca e/o fresca, when: "{{ask.forno}} {{ask.pasta}}"}
      - {kind: checkbox, label: "COMMERCIO AL DETTAGLIO DI ALIMENTI E BEVANDE:", when: "{{ask.dettaglio_alimenti}}"}
      - {kind: checkbox, label: In Esercizi di vicinato, when: "{{ask.dettaglio_alimenti}}"}

  # A shop (esercizio di vicinato): how it sells, its season, a shopping centre, the sales area
  # per sector. Drafted by draft.py from mod_esercizio_vicinato_apertura and checked by hand:
  # the shopping-centre types (G2CQ...), the C.C.N. and the factory outlet are Napoli's own
  # boxes, not the schema's. The total must equal the sectors' sum (the portal's note).
  - section: Dati sull'esercizio di vicinato
    fields:
      - {kind: checkbox, label: Vicinato, when: "{{ask.solo_distributori|not}}"}
      - {kind: checkbox, label: Vendita esclusivamente mediante apparecchi automatici, when: "{{ask.solo_distributori}}"}
      - {kind: radio, label: Vendita al dettaglio, when: "{{ask.anche_ingrosso|not}}"}
      - {kind: text, label: superficie di vendita mq, value: "{{ask.superficie_vendita_mq}}", when: "{{ask.anche_ingrosso|not}}"}
      - {kind: radio, label: Vendita congiunta al dettaglio e all'ingrosso, when: "{{ask.anche_ingrosso}}"}
      - {kind: text, label: superficie di vendita mq, nth: 2, value: "{{ask.superficie_vendita_mq}}", when: "{{ask.anche_ingrosso}}"}
      - {kind: radio, label: Permanente, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
      - {kind: text, label: dal (gg/mm), value: "{{ask.stagione_dal}}", when: "{{ask.stagionale}}"}
      - {kind: text, label: al (gg/mm), value: "{{ask.stagione_al}}", when: "{{ask.stagionale}}"}
      - {kind: radio, label: Si, when: "{{ask.in_centro_commerciale}}"}
      - {kind: radio, label: "No", when: "{{ask.in_centro_commerciale|not}}"}
      - {kind: text, label: denominazione, value: "{{ask.centro_commerciale_denominazione}}", when: "{{ask.in_centro_commerciale}}"}
      - {kind: radio, label: Si, nth: 2, when: "{{ask.in_ccn}}"}
      - {kind: radio, label: "No", nth: 2, when: "{{ask.in_ccn|not}}"}
      - {kind: text, label: Delibera di riconoscimento n., value: "{{ask.ccn_delibera}}", when: "{{ask.in_ccn}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.ccn_delibera_data|date_it}}", when: "{{ask.in_ccn}}"}  # 1: "Delibera..."
      - {kind: text, label: emanata da, value: "{{ask.ccn_delibera_ente}}", when: "{{ask.in_ccn}}"}
      - {kind: radio, label: "No", nth: 3, when: "{{ask.in_factory_outlet|not}}"}
      - {kind: checkbox, label: Alimentare, when: "{{ask.superficie_alimentare_mq|positive}}"}
      - {kind: text, label: superficie di vendita mq, nth: 3, value: "{{ask.superficie_alimentare_mq}}", when: "{{ask.superficie_alimentare_mq|positive}}"}
      - {kind: checkbox, label: Non alimentare, when: "{{ask.superficie_non_alimentare_mq|positive}}"}
      - {kind: text, label: superficie di vendita mq, nth: 4, value: "{{ask.superficie_non_alimentare_mq}}", when: "{{ask.superficie_non_alimentare_mq|positive}}"}
      - {kind: text, label: mq, value: "{{ask.superficie_vendita_mq}}"}
      - {kind: checkbox, label: Generi di monopolio, when: "{{ask.superficie_monopolio_mq|positive}}"}
      - {kind: text, label: superficie di vendita mq, nth: 5, value: "{{ask.superficie_monopolio_mq}}", when: "{{ask.superficie_monopolio_mq|positive}}"}
    # Pharmacies and fuel are not shops' business here: their boxes stay empty.
    leave: [Farmacie, Carburanti]

  # A bakery (panificio, mod_panifici_apertura): selling its own products to eat on the spot
  # (no table service), a C.C.N., a shopping centre or covered market, its season.
  - section: dati relativi all'attività
    fields:
      - {kind: radio, label: SI, when: "{{ask.consumo_sul_posto}}"}
      - {kind: radio, label: "NO", when: "{{ask.consumo_sul_posto|not}}"}
      - {kind: radio, label: Si, nth: 2, when: "{{ask.in_ccn}}"}
      - {kind: radio, label: "No", nth: 2, when: "{{ask.in_ccn|not}}"}
      - {kind: text, label: n., value: "{{ask.ccn_delibera}}", when: "{{ask.in_ccn}}"}
      - {kind: date, label: del, value: "{{ask.ccn_delibera_data|date_it}}", when: "{{ask.in_ccn}}"}
      - {kind: text, label: emanata da, value: "{{ask.ccn_delibera_ente}}", when: "{{ask.in_ccn}}"}
      - {kind: radio, label: Si, nth: 3, when: "{{ask.in_centro_commerciale}}"}
      - {kind: radio, label: "No", nth: 3, when: "{{ask.in_centro_commerciale|not}}"}
      - {kind: text, label: denominazione, value: "{{ask.centro_commerciale_denominazione}}", when: "{{ask.in_centro_commerciale}}"}
      - {kind: text, label: tipologia, value: "{{ask.centro_commerciale_tipologia}}", when: "{{ask.in_centro_commerciale}}"}
      - {kind: radio, label: Permanente, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
      - {kind: text, label: dal (gg/mm), value: "{{ask.stagione_dal}}", when: "{{ask.stagionale}}"}
      - {kind: text, label: al (gg/mm), value: "{{ask.stagione_al}}", when: "{{ask.stagionale}}"}

  # The bakery's antimafia statement and what its production manager guarantees are the
  # person's to tick; who the manager is is a fact (another person adds their own statement).
  - section: DICHIARAZIONI SUL POSSESSO DEI REQUISITI ANTIMAFIA E TECNICI
    theirs: [che non sussistono nei propri confronti, l'utilizzo delle materie prime, l'osservanza delle norme igienico-sanitarie, altro]
    fields:
      - {kind: radio, label: "di essere il/la responsabile dell'attività produttiva", when: "{{ask.responsabile_produzione_altro|not}}"}
      - {kind: radio, label: "che il/la responsabile dell'attività produttiva è:", when: "{{ask.responsabile_produzione_altro}}"}
      - {kind: text, label: il/la Sig./ra, value: "{{ask.responsabile_produzione_nome}}", when: "{{ask.responsabile_produzione_altro}}"}
      - {kind: file, label: Tipologie ammesse, value: "{{ask.responsabile_produzione_dichiarazione}}", when: "{{ask.responsabile_produzione_altro}}"}

  # An extra-hotel lodging (affittacamere, B&B, holiday homes: mod_attivita_extra_alberghiere_apertura
  # and Napoli's own boxes): its type and form, its name, its season, its services, its rooms.
  - section: TIPOLOGIA
    fields:
      - {kind: checkbox, label: AFFITTACAMERE, when: "{{ask.tipo_struttura|is_affittacamere}}"}
      - {kind: checkbox, label: BED AND BREAKFAST, when: "{{ask.tipo_struttura|is_bed_and_breakfast}}"}
      - {kind: radio, label: NON IMPRENDITORIALE, when: "{{ask.imprenditoriale|not}}"}
      - {kind: radio, label: IMPRENDITORIALE, when: "{{ask.imprenditoriale}}"}
  - section: apertura
    fields:
      - {kind: text, label: Denominazione della struttura, value: "{{ask.denominazione_struttura}}"}
      - {kind: radio, label: AFFITTACAMERE, when: "{{ask.tipo_struttura|is_affittacamere}}"}
      - {kind: radio, label: BED AND BREAKFAST, when: "{{ask.tipo_struttura|is_bed_and_breakfast}}"}
  - section: carattere dell'esercizio
    fields:
      - {kind: radio, label: Annuale, when: "{{ask.stagionale|not}}"}
      - {kind: radio, label: Stagionale, when: "{{ask.stagionale}}"}
      - {kind: text, label: dal (gg/mm), value: "{{ask.stagione_dal}}", when: "{{ask.stagionale}}"}
      - {kind: text, label: al (gg/mm), value: "{{ask.stagione_al}}", when: "{{ask.stagionale}}"}
  # Food for the guests (packaged, or prepared: that one needs the Reg. 852 notifica, a scelta);
  # no pool, beauty centre, gym or shop (a recipe refuses them). The boxes for those stay empty.
  - section: Dotazioni e servizi della struttura
    fields:
      - {kind: radio, label: non ha servizio di somministrazione, when: "{{ask.colazione|is_nessuna}}"}
      - {kind: radio, label: prevede la somministrazione di alimenti e bevande confezionati, when: "{{ask.colazione|is_confezionata}}"}
      - {kind: radio, label: prevede la somministrazione di alimenti e bevande preparati, when: "{{ask.colazione|is_preparata}}"}
      - {kind: radio, label: non ha impianti ad uso natatorio}
      - {kind: radio, label: non è dotata di centro estetico}
      - {kind: radio, label: non è dotata di sala con attrezzi da palestra}
      - {kind: radio, label: non effettua vendita di prodotti alimentari e artigianali}
    leave: [n. impianti, di mq., mq., altro, Servizio, Soggetto gestore]
  # Rooms (camere) only, singles and doubles: a row's totals and the structure's are sums of
  # what was asked. A double row after a single one is the page's second (found there).
  - section: capacità ricettiva
    fields:
      - {kind: text, label: n., value: "{{ask.camere_singole_bagno+ask.camere_singole_senza+2*ask.camere_doppie_bagno+2*ask.camere_doppie_senza}}"}
      - {kind: checkbox, label: Camere}
      - {kind: checkbox, label: Numero camere singole, when: "{{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}"}
      - {kind: text, label: con bagno (n.), value: "{{ask.camere_singole_bagno}}", when: "{{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}"}
      - {kind: text, label: senza bagno (n.), value: "{{ask.camere_singole_senza}}", when: "{{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}"}
      - {kind: text, label: totale camere (n.), value: "{{ask.camere_singole_bagno+ask.camere_singole_senza}}", when: "{{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}"}
      - {kind: text, label: Totale posti letto (n.), value: "{{ask.camere_singole_bagno+ask.camere_singole_senza}}", when: "{{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}"}
      - {kind: checkbox, label: Numero camere doppie, when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}}"}
      - {kind: text, label: con bagno (n.), value: "{{ask.camere_doppie_bagno}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive|not}}"}
      - {kind: text, label: senza bagno (n.), value: "{{ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive|not}}"}
      - {kind: text, label: totale camere (n.), value: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive|not}}"}
      - {kind: text, label: Totale posti letto (n.), value: "{{2*ask.camere_doppie_bagno+2*ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive|not}}"}
      - {kind: text, label: con bagno (n.), nth: 2, value: "{{ask.camere_doppie_bagno}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}", on_page: true}
      - {kind: text, label: senza bagno (n.), nth: 2, value: "{{ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}", on_page: true}
      - {kind: text, label: totale camere (n.), nth: 2, value: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}", on_page: true}
      - {kind: text, label: Totale posti letto (n.), nth: 2, value: "{{2*ask.camere_doppie_bagno+2*ask.camere_doppie_senza}}", when: "{{ask.camere_doppie_bagno+ask.camere_doppie_senza|positive}} {{ask.camere_singole_bagno+ask.camere_singole_senza|positive}}", on_page: true}
      - {kind: text, label: TOTALE camere n., value: "{{ask.camere_singole_bagno+ask.camere_singole_senza+ask.camere_doppie_bagno+ask.camere_doppie_senza}}"}
      - {kind: text, label: TOTALE posti letto camere n., value: "{{ask.camere_singole_bagno+ask.camere_singole_senza+2*ask.camere_doppie_bagno+2*ask.camere_doppie_senza}}"}

  # Taking over a business (subingresso, mod_subingresso), the same four sections in every
  # sector: the activity and the title it runs under, from when; why it changes hands and the
  # deed (registered: one still being registered takes a signed copy, the person's); a new web
  # address; and, for food, the previous holder's Reg. 852 notifica.
  - section: dati dell'impresa a cui si subentra
    aliases: [Dati della impresa a cui si subentra]
    fields:
      - {kind: text, label: "nell'attività di:", value: "{{ask.subingresso_attivita}}"}
      - {kind: text, label: già avviata con la SCIA/DIA/autorizzazione prot./n, value: "{{ask.cedente_titolo_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.cedente_titolo_data|date_it}}"}
      - {kind: radio, label: Avvio dell'attività contestuale, when: "{{ask.subingresso_data|empty}}"}
      - {kind: radio, label: Avvio dell'attività con decorrenza, when: "{{ask.subingresso_data|empty|not}}"}
      - {kind: date, label: dal, value: "{{ask.subingresso_data|date_it}}", when: "{{ask.subingresso_data|empty|not}}"}
  - section: motivazioni del subingresso
    # The deed being registered takes its signed copy (.p7m only): the person's upload.
    leave: [Tipologie ammesse]
    fields:
      - {kind: radio, label: Compravendita, when: "{{ask.subingresso_causa|is_compravendita}}"}
      - {kind: radio, label: Affitto d'azienda, when: "{{ask.subingresso_causa|is_affitto_d_azienda}}"}
      - {kind: radio, label: Donazione, when: "{{ask.subingresso_causa|is_donazione}}"}
      - {kind: radio, label: Fusione, when: "{{ask.subingresso_causa|is_fusione}}"}
      - {kind: radio, label: Fallimento, when: "{{ask.subingresso_causa|is_fallimento}}"}
      - {kind: radio, label: Successione, when: "{{ask.subingresso_causa|is_successione}}"}
      - {kind: radio, label: Altre cause, when: "{{ask.subingresso_causa|is_altre_cause}}"}
      - {kind: text, label: "specificare:", value: "{{ask.subingresso_causa_altro}}", when: "{{ask.subingresso_causa|is_altre_cause}}"}
      - {kind: radio, label: con atto di registrazione, when: "{{ask.atto_registrato}}"}
      - {kind: text, label: n., value: "{{ask.atto_registrazione_numero}}", when: "{{ask.atto_registrato}}"}
      - {kind: date, label: del, value: "{{ask.atto_registrazione_data|date_it}}", when: "{{ask.atto_registrato}}"}
      - {kind: radio, label: l'atto è in corso di registrazione, when: "{{ask.atto_registrato|not}}"}
  - section: variazione della denominazione
    leave: [indirizzo nuovo sito web]
    fields: []
  - section: notifica di subingresso ai sensi del Reg. CE n.852/2004
    fields:
      - {kind: text, label: Cognome e Nome oppure denominazione ditta, value: "{{ask.cedente_denominazione}}"}
      - {kind: text, label: C. F./Partita IVA, value: "{{ask.cedente_cf}}"}
      - {kind: text, label: di cui alla notifica/SCIA prot./n., value: "{{ask.cedente_notifica_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.cedente_notifica_data|date_it}}"}

  # Drafted by draft.py from the national schema (mod_acconciatori_estetisti_apertura), as drafted.
  - section: "Dati sull'attività"
    schema: modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura
    fields:
      - {kind: "text", label: "mq", value: "{{ask.superficie_complessiva}}"}
      - {kind: "text", label: "mq", value: "{{ask.superficie_attivita}}", nth: 2}
      - {kind: "tick", label: "Si", when: "{{ask.in_centro_commerciale}}"}
      - {kind: "tick", label: "No", when: "{{ask.in_centro_commerciale|not}}"}
      - {kind: "text", label: "denominazione", value: "{{ask.centro_commerciale_denominazione}}", when: "{{ask.in_centro_commerciale}}"}
      - {kind: "tick", label: "Unica o prevalente", when: "{{ask.attivita_esercita}}"}
      - {kind: "tick", label: "Svolta congiuntamente all'attività", when: "{{ask.attivita_esercita|not}}"}
      - {kind: "text", label: "di", value: "{{ask.congiunta_denominazione}}", when: "{{ask.attivita_esercita|not}}"}
      - {kind: "text", label: "prot./n.", value: "{{ask.nr_protocollo}}", when: "{{ask.attivita_esercita|not}}"}
      - {kind: "date", label: "del", value: "{{ask.data_protocollo|date_it}}", when: "{{ask.attivita_esercita|not}}"}

  - section: "Dichiarazione sul possesso dei requisiti antimafia"
    aliases: [DICHIARAZIONI SUL POSSESSO DEI REQUISITI ANTIMAFIA]
    schema: modulo_acconciatori_estetisti_apertura/scheda_anagrafica
    theirs: ["che non sussistono nei propri confronti le cause di"]
    fields: []

  - section: "Dichiarazione sul possesso dei requisiti professionali (attività di acconciatore)"
    aliases: ["Dichiarazione sul possesso dei requisiti professionali (attività di estetista)"]
    schema: modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura
    fields:
