      - {kind: text, label: da, value: "{{ask.denominazione_precedente}}", when: "{{ask.var_denominazione}}"}
      - {kind: text, label: a, nth: 2, value: "{{business.denominazione}}", when: "{{ask.var_denominazione}}"}  # 1: "a far data dal"
