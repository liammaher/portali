    aliases: ["dichiarazione relativa ai contenuti dell'intervento (titolo del richiedente"]
    leave: [coordinate geografiche, latitudine, longitudine]
    fields:
      - {kind: radio, label: proprietà, when: "{{ask.titolo|is_proprietario}}"}
      - {kind: radio, label: comproprietà, when: "{{ask.titolo|is_comproprietario}}"}
