      - {kind: text, label: rep. n°, value: "{{ask.atto_repertorio}}"}
      - {kind: text, label: rogito n°, value: "{{ask.atto_raccolta}}"}
      - {kind: text, label: registrato a, value: "{{ask.atto_registrato_a}}"}
      - {kind: date, label: in data, value: "{{ask.atto_registrazione_data|date_it}}"}
      - {kind: text, label: al n°, value: "{{ask.atto_registrazione_numero}}"}
      - {kind: textarea, label: sommaria e sintetica, value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: ad uso, value: "{{ask.destinazione_uso}}"}
      - {kind: text, label: in zona di PRG, value: "{{ask.zona_prg}}"}
  # The ordinaria's own version (art. 146 D.Lgs. 42/2004): the title and what proves it, the
  # area or building, deeds weighing on it, and the protection (only art. 136 and 142 here: its
  # recipe refuses art. 134 alone). Tried after the voltura's, which it shares a name with.
  - section: "dichiarazione relativa ai contenuti dell'intervento (titolo del richiedente, descrizione e riferimenti"
    fields:
      - {kind: radio, label: proprietà, when: "{{ask.titolo|is_proprietario}}"}
      - {kind: radio, label: comproprietà, when: "{{ask.titolo|is_comproprietario}}"}
