      - {kind: radio, label: comporta mutamento di destinazione d’uso di una singola unità immobiliare all’interno, when: "{{ask.scia_tipo|is_restauro}} {{ask.scia_cambio_uso|is_stessa_categoria}}"}
      - {kind: radio, label: "comporta mutamento di destinazione d’uso di una singola unità immobiliare, ubicata", when: "{{ask.scia_tipo|is_restauro}} {{ask.scia_cambio_uso|is_tra_categorie}}"}
      - {kind: radio, label: comporta mutamento di destinazione d’uso di un intero immobile, when: "{{ask.scia_tipo|is_restauro}} {{ask.scia_cambio_uso|is_intero_immobile}}"}
      - {kind: radio, label: intervento di ristrutturazione edilizia, when: "{{ask.scia_tipo|is_ristrutturazione}}"}
      - {kind: radio, label: non comporta mutamento di destinazione d’uso, when: "{{ask.scia_tipo|is_ristrutturazione}} {{ask.scia_cambio_uso|is_no}}"}
      - {kind: radio, label: comporta mutamento di destinazione d’uso di una singola unità immobiliare all’interno, when: "{{ask.scia_tipo|is_ristrutturazione}} {{ask.scia_cambio_uso|is_stessa_categoria}}"}
      - {kind: radio, label: "comporta mutamento di destinazione d’uso di una singola unità immobiliare, ubicata", when: "{{ask.scia_tipo|is_ristrutturazione}} {{ask.scia_cambio_uso|is_tra_categorie}}"}
      - {kind: radio, label: comporta mutamento di destinazione d’uso di un intero immobile, when: "{{ask.scia_tipo|is_ristrutturazione}} {{ask.scia_cambio_uso|is_intero_immobile}}"}
