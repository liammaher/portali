      - {kind: text, label: "sito in via, viale, piazza", value: "{{ask.immobile_indirizzo|upper}} {{ask.immobile_civico}}", when: "{{ask.titolo|is_amministratore_di_condominio}}"}
      - {kind: radio, label: altro diritto reale di godimento, when: "{{ask.titolo|is_proprietario|not}} {{ask.titolo|is_comproprietario|not}} {{ask.titolo|is_amministratore_di_condominio|not}}"}
      - {kind: text, label: specificare il titolo, value: "{{ask.titolo}}", when: "{{ask.titolo|is_proprietario|not}} {{ask.titolo|is_comproprietario|not}} {{ask.titolo|is_amministratore_di_condominio|not}}"}
      - {kind: text, label: nome cognome/denominazione del proprietario, value: "{{ask.proprietario_nome}}", when: "{{ask.titolo|is_proprietario|not}} {{ask.titolo|is_comproprietario|not}} {{ask.titolo|is_amministratore_di_condominio|not}}"}
