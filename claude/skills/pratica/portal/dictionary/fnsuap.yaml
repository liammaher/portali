    fields:
      - {kind: checkbox, label: "B.1.", when: "{{ask.paes_b1}}"}
      - {kind: checkbox, label: "B.2.", when: "{{ask.paes_b2}}"}
      - {kind: checkbox, label: "B.3.", when: "{{ask.paes_b3}}"}
      - {kind: checkbox, label: "B.4.", when: "{{ask.paes_b4}}"}
