  # SCIA edilizia: the quadri the CILA hasn't, then the progettista's asseverazioni: works of
  # art. 22 c. 1 a) to c), on structures (the seismic filing) or not, and every protection the
  # asseverazione names. The recipe's `supports` refuses the rest (fire, acoustics, asbestos,
  # systems projects, a change of use, a landscape authorization filed with it).
  # A SCIA condizionata (an assent asked with it: the Soprintendenza, a park, a vincolo) starts
  # only once the SUE says the assents are in, so it gives no start date ("Per SCIA/SCIA
  # Unica" only).
  - section: Presentazione della SCIA
    theirs: [PER PRESA VISIONE]
    leave: ["Per SCIA/SCIA Unica, il titolare dichiara"]
    fields:
      - {kind: date, label: "Per SCIA/SCIA Unica, il titolare dichiara che i lavori avranno inizio", value: "{{ask.data_inizio_lavori|date_it}}", when: "{{ask.bene_culturale|not}} {{ask.area_protetta|is_nulla_osta|not}} {{ask.idrogeologico|is_autorizzazione|not}} {{ask.idraulico|not}} {{ask.vinca|not}} {{ask.rir|is_in_area|not}} {{ask.rir|is_non_individuata|not}} {{ask.altri_vincoli_eco|is_assenso|not}} {{ask.fasce|is_assenso|not}} {{ask.paesaggio|is_semplificata|not}} {{ask.paesaggio|is_ordinaria|not}}"}

