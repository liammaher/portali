  centro_commerciale_denominazione: {type: "text", question: "denominazione", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/in_centro_commerciale/[in_centro_commerciale_ctype]/centro_commerciale_denominazione"}
  attivita_esercita: {type: "yes_no", question: "Attivita esercita? (yes: Unica o prevalente)", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/attivita_esercita/[attivita_esercita_ctype]/unica_check"}
  congiunta_denominazione: {type: "text", question: "Svolta congiuntamente all'attività: di", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/attivita_esercita/[attivita_esercita_ctype]/congiunta_denominazione"}
  nr_protocollo: {type: "text", question: "Già avviato con la SCIA: prot./n.", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/attivita_esercita/[attivita_esercita_ctype]/nr_protocollo"}
  data_protocollo: {type: "date", question: "del", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/attivita_esercita/[attivita_esercita_ctype]/data_protocollo"}
  responsabile_tecnico: {type: "yes_no", question: "di essere Responsabile tecnico?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/responsabile_tecnico_check"}
  abilitazione_professionale: {type: "yes_no", question: "di essere in possesso dell'abilitazione professionale?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/abilitazione_professionale_check"}
  ente_abilitazione_professionale: {type: "text", question: "rilasciata da", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/ente_abilitazione_professionale"}
  data_abilitazione_professionale: {type: "date", question: "in data", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/data_abilitazione_professionale"}
  atto_abilitazione_professionale: {type: "text", question: "con atto n.", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/atto_abilitazione_professionale"}
  qualifica_professionale: {type: "yes_no", question: "di essere in possesso di qualifica di acconciatore o di parrucchiere, per uomo o per donna, prevista?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/qualifica_professionale_check"}
  ente_qualifica_professionale: {type: "text", question: "rilasciata da", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/ente_qualifica_professionale"}
  data_qualifica_professionale: {type: "date", question: "in data", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/data_qualifica_professionale"}
  atto_qualifica_professionale: {type: "text", question: "con atto n.", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/atto_qualifica_professionale"}
  qualifica_professionale_estero: {type: "yes_no", question: "di avere conseguito la qualificazione professionale all'estero e di averne ottenuto il riconosciment?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/qualifica_professionale_estero_check"}
  atto_qualifica_estero_professionale: {type: "text", question: "con decreto n.", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/atto_qualifica_estero_professionale"}
  data_qualifica_estero_professionale: {type: "date", question: "in data", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/data_qualifica_estero_professionale"}
  altro: {type: "yes_no", question: "altro?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/altro_check"}
  altro_testo: {type: "text", question: "altro: (specificare)", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/altro"}
  multi_responsabili_tecnici: {type: "yes_no", question: "che il/i Responsabile/i tecnico/i è/sono:?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/multi_responsabili_tecnici_check"}
  cognome: {type: "text", question: "Cognome", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/responsabile_tecnico_blocco/cognome"}
  nome: {type: "text", question: "Nome", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/responsabile_tecnico_blocco/nome"}
  tipo_qualita_responsabile_tecnico: {type: "choice", question: "in qualità di", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/responsabile_tecnico_blocco/tipo_qualita_responsabile_tecnico", options: ["Titolare", "Socio partecipante al lavoro", "Familiare coadiuvante", "Dipendente"]}
  essere_responsabile_qualifica_professionale: {type: "yes_no", question: "che possiede/ono l'abilitazione professionale prevista, come dichiarato in Allegato B.?", schema: "modulo_acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/acconciatori_estetisti_apertura/essere_responsabile_qualifica_professionale_check"}
  allegato_dichiarazione_sul_possesso_dei_requisiti: {type: "file", question: "Caricare l'ALLEGATO B compilato + Copia documento di Identità in corso di validità"}

sections:
  # The dichiarante is the client (the titolare), as a private person. The draft opens on it.
  - section: Scheda anagrafica
    open: false
    fields:
      - {kind: radio, label: PERSONA (Privato)}
      - {kind: text, label: Nome, value: "{{c:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{c:identity.last_name}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{c:identity.codice_fiscale}}"}
      - {kind: select, label: Sesso, value: "{{c:identity.sex}}"}
      - {kind: text, label: Data nascita, value: "{{c:identity.date_of_birth|date_it}}"}
      - {kind: select, label: Provincia, value: "{{c:identity.birth_province}}"}
      - {kind: select, label: Comune, value: "{{c:identity.birth_comune|upper}}"}
      - {kind: select, label: Provincia, nth: 2, value: "{{c:residenza.provincia}}"}
      - {kind: select, label: Comune, nth: 2, value: "{{c:residenza.comune|upper}}"}
      - {kind: select, label: Toponimo (DUG), value: "{{c:residenza.indirizzo|dug}}"}
      - {kind: text, label: Denominazione stradale, value: "{{c:residenza.indirizzo|street|upper}}"}
      - {kind: text, label: Numero civico, value: "{{c:residenza.civico}}"}
      - {kind: text, label: CAP, value: "{{c:residenza.cap}}"}
      - {kind: text, label: eMail/PEC, value: "{{c:identity.email}}"}
      - {kind: text, label: Telefono fisso/cellulare, value: "{{c:identity.phone|phone_it}}"}
      # In qualità di: Proprietario, Comproprietario, Usufruttuario, Amministratore di
      # condominio, Legale rappresentante, Amministratore unico, Procuratore, Altro (+ specificare).
      - {kind: select, label: "In qualità di", value: "{{ask.titolo|qualita}}"}
      - {kind: text, label: specificare, via: Altro, value: "{{ask.titolo|qualita_altro}}", when: "{{ask.titolo|qualita_is_altro}}"}

  # The architect, from the studio vault's titolare. Prefilled with the SPID login's name and
  # CF, overwritten here.
  - section: Qualifica e dati del procuratore
    leave: [Fax, Stato]
    fields:
      - {kind: select, label: Qualifica del procuratore, value: PROFESSIONISTA INCARICATO}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: select, label: Sesso, value: "{{t:identity.sex}}"}
      - {kind: select, label: Cittadinanza, value: ITALIA}
      - {kind: text, label: Nato a, value: "{{t:identity.birth_comune|upper}}"}
      - {kind: text, label: il, value: "{{t:identity.date_of_birth|date_it}}"}
      - {kind: radio, label: in Italia}
      - {kind: text, label: Provincia, value: "{{t:identity.birth_province}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{t:identity.codice_fiscale}}"}
      - {kind: text, label: Residente in, value: "{{t:residenza.comune|upper}}"}
      - {kind: text, label: Provincia, nth: 2, value: "{{t:residenza.provincia}}"}
      - {kind: text, label: CAP, value: "{{t:residenza.cap}}"}
      - {kind: text, label: Indirizzo, value: "{{t:residenza.indirizzo|upper}} {{t:residenza.civico}}"}
      - {kind: text, label: Tel, value: "{{t:identity.phone|phone_it}}"}
      - {kind: text, label: eMail PEC, value: "{{t:identity.pec}}"}

  - section: Oggetto della pratica
    fields:
      - {kind: text, label: descrizione sintetica, value: "{{ask.oggetto}}"}

  # The client's own domicilio digitale: saved empty when they have no PEC. A client with a
  # PEC (INAD, its address box) isn't mapped yet.
  - section: DOMICILIO DIGITALE
    fields: []

  # The box under the PEC ("si dichiara di essere consapevoli ...") is required, and the
  # person's: the run leaves it and its "required" to them.
  - section: DOMICILIO ELETTRONICO
    theirs: [Si dichiara di essere consapevoli]
    fields:
      - {kind: text, label: "N.B. Inserire l'indirizzo della casella PEC", value: "{{t:identity.pec}}"}

  # The property: no vault category holds it yet, so it comes from pre-flight's answers.
  - section: Localizzazione dell'intervento
    # The proroga's "sede dell'attività" and the voltura's "ubicazione dell'attività" are the
    # same block: where the works are (a business vault's recipe takes its own entry first).
    aliases: ["ubicazione dell'immobile", "dichiarazione relativa alla sede dell'attività", "dichiarazione ubicazione dell'intervento", "ubicazione dell'attività"]
    leave: [Frazione]
    fields:
      - {kind: text, label: CAP, value: "{{ask.immobile_cap}}"}
      - {kind: lookup, label: "Via, Viale, Piazza", value: "{{ask.immobile_indirizzo}}"}
      - {kind: text, label: n° civico, value: "{{ask.immobile_civico}}"}
      - {kind: text, label: scala, value: "{{ask.immobile_scala}}", optional: true}
      - {kind: text, label: piano, value: "{{ask.immobile_piano}}", optional: true}
      - {kind: text, label: interno, value: "{{ask.immobile_interno}}", optional: true}

  - section: Dati catastali
    leave: [sezione Amministrativa, classe]
    fields:
      - {kind: radio, label: Nuovo Catasto Edilizio Urbano}
      - {kind: text, label: foglio, value: "{{ask.catasto_foglio}}"}
      - {kind: text, label: particella/mappale, value: "{{ask.catasto_particella}}"}
      - {kind: text, label: subalterno, value: "{{ask.catasto_subalterno}}"}
      - {kind: text, label: sezione Urbana, value: "{{ask.catasto_sezione}}", optional: true}
      - {kind: select, label: categoria, value: "{{ask.catasto_categoria|categoria}}"}

  # A tenant: "altro" + locatario, and the non-exclusive title, which opens the owner's row
  # (the terzo titolare who gave assent): `o:` the owner company, `r:` its legale rappresentante.
  - section: a) Titolarità dell'intervento
    aliases: ["Titolarità dell'intervento"]
    fields:
      - {kind: select, label: "Il richiedente dichiara di avere titolo", value: altro}
      - {kind: text, label: specificare, value: locatario}
      - {kind: radio, label: non avere titolarità esclusiva}
      - {kind: text, label: Cognome, value: "{{r:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{r:identity.first_name}}"}
      - {kind: text, label: C.F., value: "{{r:identity.codice_fiscale}}"}
      - {kind: date, label: Data di nascita, value: "{{r:identity.date_of_birth|date_it}}"}
      - {kind: select, label: Sesso, value: "{{r:identity.sex|sesso}}"}
      - {kind: select, label: Provincia, value: "{{r:identity.birth_province}}"}
      - {kind: text, label: Comune italiano, value: "{{r:identity.birth_comune|upper}}"}
      - {kind: select, label: Provincia, nth: 2, value: "{{r:residenza.provincia}}"}
      - {kind: text, label: Comune italiano, nth: 2, value: "{{r:residenza.comune|upper}}"}
      - {kind: text, label: "Via, Piazza", value: "{{r:residenza.indirizzo|upper}}"}
      - {kind: text, label: "N.", value: "{{r:residenza.civico}}"}
      - {kind: text, label: C.A.P., value: "{{r:residenza.cap}}"}
      - {kind: text, label: PEC / posta elettronica, value: "{{o:business.pec}}"}
      - {kind: text, label: Telefono, value: "{{o:business.telefono|phone_it}}"}
      - {kind: checkbox, label: Da compilare solo nel caso in cui il titolare sia}
      - {kind: text, label: in qualità di, value: legale rappresentante}
      - {kind: text, label: della ditta / società, value: "{{o:business.denominazione}}"}
      - {kind: text, label: con codice fiscale / p. IVA, value: "{{o:business.partita_iva}}"}

  - section: b) Opere su parti comuni
    fields:
      - {kind: radio, label: non riguardano parti comuni}

  # Only the dichiarante's PER PRESA VISIONE.
  - section: c) Presentazione della comunicazione
    omit: the dichiarante's PER PRESA VISIONE

  # Works already started (d.2): the date and the 333 € receipt, uploaded here.
  - section: d) Qualificazione dell'intervento
    fields:
      - {kind: radio, label: intervento in corso di esecuzione}
      - {kind: date, label: intervento iniziato in data, value: "{{ask.data_inizio_lavori|date_it}}"}
      - {kind: file, label: "Tipologie ammesse", value: "{{ask.ricevuta_sanzione}}"}

  - section: e) Destinazione d'uso
    fields:
      - {kind: select, label: "L'intervento interessa l'immobile", value: "{{ask.destinazione_uso}}"}

  - section: f) Calcolo del contributo
    fields:
      - {kind: radio, label: l'intervento da realizzare è a titolo gratuito}

  # The architect presents the pratica and is progettista and direttore dei lavori: her name
  # comes from the procuratore's section.
  - section: G1) Tecnici incaricati
    leave: [fax]
    fields:
      - {kind: radio, label: titolare dell'intervento o procuratore}
      - {kind: checkbox, label: incaricato anche come direttore dei lavori}
      - {kind: select, label: Provincia, value: "{{business.sede_legale_provincia}}"}
      - {kind: text, label: Comune italiano, value: "{{business.sede_legale_comune|upper}}"}
      - {kind: text, label: "Via, Piazza", value: "{{business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: "N.", value: "{{business.sede_legale_civico}}"}
      - {kind: text, label: C.A.P., value: "{{business.sede_legale_cap}}"}
      - {kind: text, label: Iscritto all'ordine/collegio, value: "{{t:albo.ordine}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}"}
      - {kind: text, label: Telefono, value: "{{business.telefono|phone_it}}"}
      - {kind: text, label: cell., value: "{{t:identity.phone|phone_it}}"}
      - {kind: text, label: posta elettronica certificata, value: "{{t:identity.pec}}"}

  - section: G2) Altri tecnici incaricati
    fields: []

  # Two firms on site: the second firm's block comes from "+". Fields by label inside the
  # block-th repeat that starts at "Ragione sociale".
  - section: h) Impresa esecutrice dei lavori
    leave: [Telefono, fax]
    firms: [f1, f2]
    fields:
      - {kind: radio, label: lavori sono/saranno eseguiti dall, if_present: true}
      - {kind: radio, label: i lavori sono eseguiti/sono stati eseguiti, if_present: true}
    block:
      - {kind: text, label: Ragione sociale, value: "{{F:business.denominazione}}"}
      - {kind: text, label: codice fiscale / p. IVA, value: "{{F:business.partita_iva}}"}
      - {kind: select, label: Iscritta alla C.C.I.A.A. di, value: "{{F:business.cciaa}}"}
      - {kind: text, label: n., nth: 1, value: "{{F:business.rea|rea_num}}"}
      - {kind: text, label: con sede in, value: "{{F:business.sede_legale_comune|upper}}"}
      - {kind: select, label: provincia, nth: 1, value: "{{F:business.sede_legale_provincia}}"}
      - {kind: text, label: "Via, Piazza", value: "{{F:business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: N., nth: 2, value: "{{F:business.sede_legale_civico}}"}
      - {kind: text, label: C.A.P., value: "{{F:business.sede_legale_cap}}"}
      - {kind: text, label: Cognome, value: "{{F:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{F:identity.first_name}}"}
      - {kind: text, label: codice fiscale, nth: 2, value: "{{F:identity.codice_fiscale}}"}
      - {kind: text, label: nato a, value: "{{F:identity.birth_comune|upper}}"}
      - {kind: select, label: provincia, nth: 2, value: "{{F:identity.birth_province}}"}
      - {kind: date, label: nato il, value: "{{F:identity.date_of_birth|date_it}}"}
      - {kind: text, label: cell., value: "{{F:identity.phone|phone_it}}"}
      - {kind: text, label: posta elettronica, value: "{{F:business.pec}}"}
      # DURC: each box opens its own rows (and renumbers what follows).
      - {kind: checkbox, label: INPS}
      - {kind: text, label: sede di, nth: 1, value: "{{F:business.sede_legale_comune|upper}}"}
      - {kind: text, label: Matr./Pos. Contr., value: "{{F:business.inps_matricola}}"}
      - {kind: checkbox, label: INAIL}
      - {kind: text, label: sede di, nth: 2, value: "{{F:business.inail_codice_sede}}"}
      - {kind: text, label: codice impresa, value: "{{F:business.inail_codice_ditta}}"}
      - {kind: text, label: pos. assicurativa, value: "{{F:business.inail_pat}}"}

  # Site safety. A choice is a radio in one pratica and a checkbox in another (`tick`); the
  # check of the firms' documents shows only in some (`if_present`).
  - section: i) Rispetto degli obblighi
    fields:
      - {kind: tick, label: non ricade nell'ambito di applicazione delle norme, when: "{{ask.dlgs81|not}}"}
      - {kind: tick, label: ricade nell'ambito di applicazione delle norme, when: "{{ask.dlgs81}}"}
      - {kind: tick, label: dichiara che l'entità presunta del cantiere è inferiore, when: "{{ask.sotto_200}}"}
      - {kind: tick, label: dichiara che l'entità presunta del cantiere è pari o superiore, if_present: true, when: "{{ask.sotto_200|not}}"}
      - {kind: tick, label: dichiara di aver verificato la documentazione, if_present: true, when: "{{ask.verificato_idoneita}}"}
      - {kind: tick, label: dichiara che l'intervento non è soggetto all'invio, when: "{{ask.notifica_dovuta|not}}"}
      - {kind: tick, label: dichiara che l'intervento è soggetto all'invio, when: "{{ask.notifica_dovuta}}"}
      - {kind: tick, label: allega alla presente comunicazione la notifica, if_present: true, when: "{{ask.notifica_dovuta}}"}
      - {kind: checkbox, label: e allega alla presente segnalazione la notifica, if_present: true, on_page: true, when: "{{ask.notifica_dovuta}}"}

  # The progettista's relazione (her asseverazione and signature are the signed CILA).
  - section: Relazione Tecnica di Asseverazione
    leave: [specificare il tipo di intervento, Comunicazioni, Autorità competente, Tipologia di atto, Note]
    fields:
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{t:albo.ordine}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}"}
      - {kind: checkbox, label: interventi di manutenzione straordinaria}
      - {kind: textarea, label: e che consistono in, value: "{{ask.dettaglio_intervento}}"}
      - {kind: radio, label: "no"}

  # The fees, when the Comune's tariff has them. "pagamento on line" is required with them and
  # the only mode offered; it pays nothing (the SUE's payment page has no methods: the fees go
  # by bank transfer and their receipt is uploaded there).
  - section: Dichiarazione relativa ai diritti
    fields:
      - {kind: radio, label: non sono dovuti oneri, when: "{{ask.diritti_euro|positive|not}}"}
      - {kind: radio, label: poiché non previsti dal tariffario, when: "{{ask.diritti_euro|positive|not}}"}
      - {kind: radio, label: sono dovuti oneri quali diritti o spese, when: "{{ask.diritti_euro|positive}}"}
      - {kind: number, label: per un totale di Euro, value: "{{ask.diritti_euro}}", when: "{{ask.diritti_euro|positive}}"}
      - {kind: radio, label: pagamento on line, when: "{{ask.diritti_euro|positive}}"}

  # CIL (opere temporanee): the communication, the dates, what the works are.
  - section: Comunicazione inizio lavori
    fields:
      - {kind: tick, label: COMUNICA L'INIZIO DEI LAVORI}
      - {kind: date, label: i lavori avranno inizio in data, value: "{{ask.data_inizio_lavori|date_it}}"}
      - {kind: date, label: i lavori termineranno in data, value: "{{ask.data_fine_prevista|date_it}}"}
      - {kind: textarea, label: le opere consistono in, value: "{{ask.dettaglio_intervento}}"}

  # Other permits filed with it: none mapped, left empty.
  - section: Altre comunicazioni, segnalazioni e asseverazioni
    leave: [Comunicazioni, Autorità competente]
    fields: []

  # Inizio lavori after a permesso di costruire: the permit, the date, its holder (the client),
  # where the works are.
  - section: dichiarazione riferimenti permesso di costruire
    fields:
      - {kind: text, label: numero permesso, value: "{{ask.pdc_numero}}"}
      - {kind: date, label: data rilascio, value: "{{ask.pdc_data|date_it}}"}
      - {kind: text, label: numero protocollo generale, value: "{{ask.pdc_protocollo}}"}
      - {kind: text, label: anno protocollo generale, value: "{{ask.pdc_anno}}"}
      - {kind: text, label: per interventi di, value: "{{ask.pdc_interventi}}"}

  - section: dichiarazione relativa alla comunicazione di inizio lavori
    fields:
      - {kind: date, label: in data, value: "{{ask.data_inizio_lavori|date_it}}"}

  - section: dichiarazione dell'intestatario del permesso di costruire
    fields:
      - {kind: text, label: intestatario, value: "{{c:identity.first_name|upper}} {{c:identity.last_name|upper}}"}
      - {kind: text, label: in qualità di, value: "{{ask.titolo}}"}
      - {kind: text, label: residente in, value: "{{c:residenza.comune|upper}}"}
      - {kind: text, label: CAP, value: "{{c:residenza.cap}}"}
      - {kind: text, label: via, value: "{{c:residenza.indirizzo|upper}}"}
      - {kind: text, label: numero civico, value: "{{c:residenza.civico}}"}

  # The SUE is the Comune di Napoli's: the comune is always Napoli.
  - section: dichiarazione dell'ubicazione dei lavori
    fields:
      - {kind: text, label: comune, value: NAPOLI}
      - {kind: text, label: "via, viale, piazza", value: "{{ask.immobile_indirizzo}}"}
      - {kind: text, label: numero civico, value: "{{ask.immobile_civico}}"}

  # Proroga dei termini di inizio o di fine lavori (art. 15 c. 2 DPR 380/2001): the property,
  # the permit (a permesso di costruire, or a DIA by its P.G. number), its catasto and holder,
  # the dates, the days asked and why.
  - section: dichiarazione dell'immobile oggetto della domanda
    leave: [Località, N.Put]
    fields:
      - {kind: text, label: "via , viale, piazza", value: "{{ask.immobile_indirizzo}}"}
      - {kind: text, label: numero civico, value: "{{ask.immobile_civico}}"}
      - {kind: text, label: CAP, value: "{{ask.immobile_cap}}"}
      - {kind: radio, label: di cui al Permesso di costruire, when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: radio, label: di cui alla DIA, when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: text, label: P.G. numero, nth: 2, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_dia}}"}
      - {kind: text, label: foglio, value: "{{ask.catasto_foglio}}"}
      - {kind: text, label: mappale, value: "{{ask.catasto_particella}}"}
      - {kind: text, label: subalterno, value: "{{ask.catasto_subalterno}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name|upper}} {{c:identity.last_name|upper}}"}
      - {kind: date, label: la cui data di inizio lavori è prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}
      - {kind: date, label: la cui data di fine lavori dovrebbe essere entro il, value: "{{ask.fine_termine|date_it}}", if_present: true}
      - {kind: date, label: ed è invece prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}

  # The same references where the proroga's property is asked elsewhere (the proroga di
  # ultimazione, the 30-month extensions of art. 10-septies L. 51/2022): a permesso or a SCIA.
  - section: riferimenti titolo edilizio e data prevista
    leave: [N.Put]
    fields:
      - {kind: radio, label: di cui al Permesso di costruire, when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: radio, label: di cui alla SCIA, when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: text, label: P.G. numero, nth: 2, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: date, label: del, nth: 2, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name|upper}} {{c:identity.last_name|upper}}"}
      - {kind: date, label: la cui data di inizio lavori è prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}
      - {kind: date, label: la cui data di fine lavori dovrebbe essere entro il, value: "{{ask.fine_termine|date_it}}", if_present: true}
      - {kind: date, label: ed è invece prevista per, value: "{{ask.proroga_data_prevista|date_it}}", if_present: true}

  # The firm named or changed on its own (nomina, cambio dell'impresa esecutrice): the first
  # firm (`f1:`). The CILA's quadro h), with its blocks and DURC, is the entry above.
  - section: Impresa esecutrice dei lavori
    aliases: [nuova impresa esecutrice]
    leave: [telefono fisso]
    fields:
      - {kind: text, label: denominazione dell'impresa, value: "{{f1:business.denominazione}}"}
      - {kind: text, label: Codice Fiscale/Partita Iva, value: "{{f1:business.partita_iva}}"}
      - {kind: text, label: con sede legale a, value: "{{f1:business.sede_legale_comune|upper}}"}
      - {kind: text, label: Provincia, value: "{{f1:business.sede_legale_provincia}}"}
      - {kind: text, label: CAP, value: "{{f1:business.sede_legale_cap}}"}
      - {kind: text, label: "in via, viale, piazza", value: "{{f1:business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: n.civico, value: "{{f1:business.sede_legale_civico}}"}
      - {kind: text, label: cell., value: "{{f1:identity.phone|phone_it}}"}
      - {kind: text, label: PEC, value: "{{f1:business.pec}}"}
      - {kind: text, label: iscritta alla Camera di Commercio di, value: "{{f1:business.cciaa|provincia_nome}}"}
      - {kind: text, label: n. REA, value: "{{f1:business.rea|rea_num}}"}

  - section: titolo edilizio posseduto
    fields:
      - {kind: text, label: tipologia titolo edilizio, value: "{{ask.titolo_tipo|upper}}"}
      - {kind: text, label: n., value: "{{ask.pdc_numero}}"}
      - {kind: text, label: anno, value: "{{ask.pdc_anno}}"}

  - section: oggetto dell'istanza
    fields:
      - {kind: radio, label: prima nomina dell'impresa esecutrice, when: "{{ask.nomina_aggiunta|not}}"}
      - {kind: radio, label: nomina in aggiunta alla precedente impresa, when: "{{ask.nomina_aggiunta}}"}

  # Landscape pratiche: the tecnico is the architect who files with the procura; another
  # tecnico (the other choice's boxes) isn't mapped.
  - section: dati relativi al nome del tecnico
    leave: [cognome, nome, codice fiscale, Stato, Provincia, Comune italiano, "Via, viale", Numero civico, C.A.P., Telefono, Fax, Cell., Posta elettronica]
    fields:
      - {kind: radio, label: è colui che presenta la pratica}
      - {kind: text, label: ordine/collegio/albo, value: "{{t:albo.ordine}}"}
      - {kind: text, label: provincia (sigla), value: "{{t:albo.provincia}}"}
      - {kind: text, label: numero iscrizione, value: "{{t:albo.numero}}"}

  # The 30-month extension of art. 10-septies L. 51/2022 where the title may be a landscape
  # authorization too.
  - section: Riferimenti titolo edilizio e/o paesaggistico e data prevista
    leave: [N.Put]
    fields:
      - {kind: radio, label: di cui al Permesso di costruire, when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_permesso_di_costruire}}"}
      - {kind: radio, label: di cui alla SCIA, when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: text, label: P.G. numero, value: "{{ask.pdc_protocollo}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: date, label: del, value: "{{ask.pdc_data|date_it}}", when: "{{ask.titolo_tipo|is_scia}}"}
      - {kind: radio, label: di cui all'autorizzazione paesaggistica, when: "{{ask.titolo_tipo|is_autorizzazione_paesaggistica}}"}
      - {kind: text, label: prot.n., value: "{{ask.paes_protocollo}}", when: "{{ask.titolo_tipo|is_autorizzazione_paesaggistica}}"}
      - {kind: date, label: del, value: "{{ask.paes_data|date_it}}", when: "{{ask.titolo_tipo|is_autorizzazione_paesaggistica}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name|upper}} {{c:identity.last_name|upper}}"}
      - {kind: date, label: la cui data di fine lavori dovrebbe essere entro il, value: "{{ask.fine_termine|date_it}}"}
      - {kind: date, label: ed è invece prevista per, value: "{{ask.proroga_data_prevista|date_it}}"}

  # Proroga of a landscape authorization (art. 10-septies L. 51/2022): the communication
  # itself, and the authorization's references and expiry.
  - section: PERIODO DI PROROGA
    fields:
      - {kind: checkbox, label: Il sottoscritto comunica la proroga di due anni}
  - section: RIFERIMENTI AUTORIZZAZIONE PAESAGGISTICA E DATA SCADENZA EFFICACIA
    fields:
      - {kind: text, label: Autorizzazione paesaggistica P.G. numero, value: "{{ask.paes_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.paes_data|date_it}}"}
      - {kind: text, label: per (specificare l'oggetto dell'intervento), value: "{{ask.pdc_interventi}}"}
      - {kind: text, label: intestato a, value: "{{c:identity.first_name|upper}} {{c:identity.last_name|upper}}"}
      - {kind: date, label: la cui data di scadenza dell'efficacia dovrebbe essere il, value: "{{ask.paes_scadenza|date_it}}"}
      - {kind: date, label: ed è invece prevista per il, value: "{{ask.proroga_data_prevista|date_it}}"}

  # Autorizzazione paesaggistica semplificata (DPR 31/2017): what the works are in Allegato B
  # (a box per item; a pratica may fall under several) and the protection the property is under.
  # Its other sections are the CILA's and the proroga's.
