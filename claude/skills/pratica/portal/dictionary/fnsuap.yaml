# What goes in each field of the impresainungiorno front office (fnsuap: the SUAP and the SUE),
# by section and label, for gen.py. A section here serves every pratica that has it: the CILA,
# the SCIA and the fine lavori share the Scheda anagrafica, the procuratore, the domicilio and
# the diritti. Ids are not here: they come from each pratica's crawl (catalogue/<comune>/sections).
#
# A field: kind and label (the start of one of its first texts on the page: its own cell, the
# row above, the cell to its left, as inpage.js reads them), `nth` when several share the label,
# the value (vault fields by role, {{ask.x}} for pre-flight's questions) and `when`. A radio or a
# checkbox listed is ticked, and what it opens is found in the crawl. `via: <option>` is a field
# a templated dropdown opens only on that option (its `when` says when). `leave:` names what the
# section shows that stays empty; `omit:` a section that is the person's alone.
#
# Roles (answers.json "people"): no prefix and `t:` are the studio's own (the business and its
# titolare, the architect), `c:` the client, `o:` the owner company, `r:` its legale
# rappresentante, `f1:`/`f2:` the firms.

asks:
  descrizione:
    type: text
    question: "A name for the draft in Pratiche in bozza"
    default: "PROVA NON INVIARE - {{c:identity.last_name}}"
  titolo:
    type: text
    question: "The client's title to the property (proprietario, comproprietario, usufruttuario, amministratore di condominio, locatario)"
  oggetto:
    type: text
    question: "The works in one sentence (300 characters)"
  immobile_indirizzo: {type: text, question: "The property's street, as the Comune names it (e.g. VIA DOMENICO FONTANA)"}
  immobile_civico: {type: text, question: "Its civico"}
  immobile_cap: {type: text, question: "Its CAP"}
  immobile_scala: {type: text, question: "Scala", default: ""}
  immobile_piano: {type: text, question: "Piano", default: ""}
  immobile_interno: {type: text, question: "Interno", default: ""}
  catasto_foglio: {type: text, question: "Catasto fabbricati: foglio"}
  catasto_particella: {type: text, question: "particella"}
  catasto_subalterno: {type: text, question: "subalterno"}
  catasto_sezione: {type: text, question: "sezione urbana", default: ""}
  catasto_categoria: {type: text, question: "categoria catastale (e.g. A/2)"}
  destinazione_uso: {type: text, question: "Destinazione d'uso (residenziale, industriale, commerciale, altro)", default: residenziale}
  data_inizio_lavori: {type: date, question: "When the works started (they're already under way: a late CILA, d.2)"}
  ricevuta_sanzione: {type: file, question: "The 333 € penalty receipt (PDF)"}
  dettaglio_intervento:
    type: text
    question: "The works for the relazione tecnica (500 characters)"
  diritti_euro: {type: number, question: "The SUE's diritti for this pratica in euro (0 when none are due)"}
  data_fine_lavori: {type: date, question: "When the works ended"}
  fine_completa: {type: yes_no, question: "Were the works finished completely (not in part)?", default: "true"}
  titolo_edilizio: {type: text, question: "The title the works were done under (e.g. C.I.L.A.)"}
  titolo_protocollo: {type: text, question: "Its protocol number"}
  titolo_data: {type: date, question: "Its protocol date"}
  documento_identita_cliente: {type: file, question: "The client's identity document (PDF)"}
  assenso_proprietario: {type: file, question: "The owner's signed assent to the works (PDF)"}
  notifica_preliminare: {type: file, question: "The notifica preliminare already sent (PDF)"}
  elaborati_grafici: {type: file, question: "The drawings: stato di fatto, progetto, comparativo (PDF)"}
  relazione_tecnica: {type: file, question: "The relazione tecnica (PDF)"}

sections:
  # The dichiarante is the client (the titolare), as a private person. The draft opens on it.
  - section: Scheda anagrafica
    open: false
    fields:
      - {kind: radio, label: PERSONA (Privato)}
      - {kind: text, label: Nome, value: "{{c:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{c:identity.last_name}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{c:identity.codice_fiscale}}"}
      - {kind: select, label: Sesso, value: "{{c:identity.sex}}"}
      - {kind: text, label: Data nascita, value: "{{c:identity.date_of_birth|date_it}}"}
      - {kind: select, label: Provincia, value: "{{c:identity.birth_province}}"}
      - {kind: select, label: Comune, value: "{{c:identity.birth_comune|upper}}"}
      - {kind: select, label: Provincia, nth: 2, value: "{{c:residenza.provincia}}"}
      - {kind: select, label: Comune, nth: 2, value: "{{c:residenza.comune|upper}}"}
      - {kind: select, label: Toponimo (DUG), value: "{{c:residenza.indirizzo|dug}}"}
      - {kind: text, label: Denominazione stradale, value: "{{c:residenza.indirizzo|street|upper}}"}
      - {kind: text, label: Numero civico, value: "{{c:residenza.civico}}"}
      - {kind: text, label: CAP, value: "{{c:residenza.cap}}"}
      - {kind: text, label: eMail/PEC, value: "{{c:identity.email}}"}
      - {kind: text, label: Telefono fisso/cellulare, value: "{{c:identity.phone|phone_it}}"}
      # In qualità di: Proprietario, Comproprietario, Usufruttuario, Amministratore di
      # condominio, Legale rappresentante, Amministratore unico, Procuratore, Altro (+ specificare).
      - {kind: select, label: "In qualità di", value: "{{ask.titolo|qualita}}"}
      - {kind: text, label: specificare, via: Altro, value: "{{ask.titolo|qualita_altro}}", when: "{{ask.titolo|qualita_is_altro}}"}

  # The architect, from the studio vault's titolare. Prefilled with the SPID login's name and
  # CF, overwritten here.
  - section: Qualifica e dati del procuratore
    leave: [Fax, Stato]
    fields:
      - {kind: select, label: Qualifica del procuratore, value: PROFESSIONISTA INCARICATO}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: select, label: Sesso, value: "{{t:identity.sex}}"}
      - {kind: select, label: Cittadinanza, value: ITALIA}
      - {kind: text, label: Nato a, value: "{{t:identity.birth_comune|upper}}"}
      - {kind: text, label: il, value: "{{t:identity.date_of_birth|date_it}}"}
      - {kind: radio, label: in Italia}
      - {kind: text, label: Provincia, value: "{{t:identity.birth_province}}"}
      - {kind: text, label: Cod.Fiscale, value: "{{t:identity.codice_fiscale}}"}
      - {kind: text, label: Residente in, value: "{{t:residenza.comune|upper}}"}
      - {kind: text, label: Provincia, nth: 2, value: "{{t:residenza.provincia}}"}
      - {kind: text, label: CAP, value: "{{t:residenza.cap}}"}
      - {kind: text, label: Indirizzo, value: "{{t:residenza.indirizzo|upper}} {{t:residenza.civico}}"}
      - {kind: text, label: Tel, value: "{{t:identity.phone|phone_it}}"}
      - {kind: text, label: eMail PEC, value: "{{t:identity.pec}}"}

  - section: Oggetto della pratica
    fields:
      - {kind: text, label: descrizione sintetica, value: "{{ask.oggetto}}"}

  # The client's own domicilio digitale: saved empty when they have no PEC. A client with a
  # PEC (INAD, its address box) isn't mapped yet.
  - section: DOMICILIO DIGITALE
    fields: []

  # The box under the PEC ("si dichiara di essere consapevoli ...") is required, and the
  # person's: the run leaves it and its "required" to them.
  - section: DOMICILIO ELETTRONICO
    theirs: [Si dichiara di essere consapevoli]
    fields:
      - {kind: text, label: "N.B. Inserire l'indirizzo della casella PEC", value: "{{t:identity.pec}}"}

  # The property: no vault category holds it yet, so it comes from pre-flight's answers.
  - section: Localizzazione dell'intervento
    aliases: ["ubicazione dell'immobile"]
    leave: [Frazione]
    fields:
      - {kind: text, label: CAP, value: "{{ask.immobile_cap}}"}
      - {kind: lookup, label: "Via, Viale, Piazza", value: "{{ask.immobile_indirizzo}}"}
      - {kind: text, label: n° civico, value: "{{ask.immobile_civico}}"}
      - {kind: text, label: scala, value: "{{ask.immobile_scala}}", optional: true}
      - {kind: text, label: piano, value: "{{ask.immobile_piano}}", optional: true}
      - {kind: text, label: interno, value: "{{ask.immobile_interno}}", optional: true}

  - section: Dati catastali
    leave: [sezione Amministrativa, classe]
    fields:
      - {kind: radio, label: Nuovo Catasto Edilizio Urbano}
      - {kind: text, label: foglio, value: "{{ask.catasto_foglio}}"}
      - {kind: text, label: particella/mappale, value: "{{ask.catasto_particella}}"}
      - {kind: text, label: subalterno, value: "{{ask.catasto_subalterno}}"}
      - {kind: text, label: sezione Urbana, value: "{{ask.catasto_sezione}}", optional: true}
      - {kind: select, label: categoria, value: "{{ask.catasto_categoria|categoria}}"}

  # A tenant: "altro" + locatario, and the non-exclusive title, which opens the owner's row
  # (the terzo titolare who gave assent): `o:` the owner company, `r:` its legale rappresentante.
  - section: a) Titolarità dell'intervento
    aliases: ["Titolarità dell'intervento"]
    fields:
      - {kind: select, label: "Il richiedente dichiara di avere titolo", value: altro}
      - {kind: text, label: specificare, value: locatario}
      - {kind: radio, label: non avere titolarità esclusiva}
      - {kind: text, label: Cognome, value: "{{r:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{r:identity.first_name}}"}
      - {kind: text, label: C.F., value: "{{r:identity.codice_fiscale}}"}
      - {kind: date, label: Data di nascita, value: "{{r:identity.date_of_birth|date_it}}"}
      - {kind: select, label: Sesso, value: "{{r:identity.sex|sesso}}"}
      - {kind: select, label: Provincia, value: "{{r:identity.birth_province}}"}
      - {kind: text, label: Comune italiano, value: "{{r:identity.birth_comune|upper}}"}
      - {kind: select, label: Provincia, nth: 2, value: "{{r:residenza.provincia}}"}
      - {kind: text, label: Comune italiano, nth: 2, value: "{{r:residenza.comune|upper}}"}
      - {kind: text, label: "Via, Piazza", value: "{{r:residenza.indirizzo|upper}}"}
      - {kind: text, label: "N.", value: "{{r:residenza.civico}}"}
      - {kind: text, label: C.A.P., value: "{{r:residenza.cap}}"}
      - {kind: text, label: PEC / posta elettronica, value: "{{o:business.pec}}"}
      - {kind: text, label: Telefono, value: "{{o:business.telefono|phone_it}}"}
      - {kind: checkbox, label: Da compilare solo nel caso in cui il titolare sia}
      - {kind: text, label: in qualità di, value: legale rappresentante}
      - {kind: text, label: della ditta / società, value: "{{o:business.denominazione}}"}
      - {kind: text, label: con codice fiscale / p. IVA, value: "{{o:business.partita_iva}}"}

  - section: b) Opere su parti comuni
    fields:
      - {kind: radio, label: non riguardano parti comuni}

  # Only the dichiarante's PER PRESA VISIONE.
  - section: c) Presentazione della comunicazione
    omit: the dichiarante's PER PRESA VISIONE

  # Works already started (d.2): the date and the 333 € receipt, uploaded here.
  - section: d) Qualificazione dell'intervento
    fields:
      - {kind: radio, label: intervento in corso di esecuzione}
      - {kind: date, label: intervento iniziato in data, value: "{{ask.data_inizio_lavori|date_it}}"}
      - {kind: file, label: "Tipologie ammesse", value: "{{ask.ricevuta_sanzione}}"}

  - section: e) Destinazione d'uso
    fields:
      - {kind: select, label: "L'intervento interessa l'immobile", value: "{{ask.destinazione_uso}}"}

  - section: f) Calcolo del contributo
    fields:
      - {kind: radio, label: l'intervento da realizzare è a titolo gratuito}

  # The architect presents the pratica and is progettista and direttore dei lavori: her name
  # comes from the procuratore's section.
  - section: G1) Tecnici incaricati
    leave: [fax]
    fields:
      - {kind: radio, label: titolare dell'intervento o procuratore}
      - {kind: checkbox, label: incaricato anche come direttore dei lavori}
      - {kind: select, label: Provincia, value: "{{business.sede_legale_provincia}}"}
      - {kind: text, label: Comune italiano, value: "{{business.sede_legale_comune|upper}}"}
      - {kind: text, label: "Via, Piazza", value: "{{business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: "N.", value: "{{business.sede_legale_civico}}"}
      - {kind: text, label: C.A.P., value: "{{business.sede_legale_cap}}"}
      - {kind: text, label: Iscritto all'ordine/collegio, value: "{{t:albo.ordine}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}"}
      - {kind: text, label: Telefono, value: "{{business.telefono|phone_it}}"}
      - {kind: text, label: cell., value: "{{t:identity.phone|phone_it}}"}
      - {kind: text, label: posta elettronica certificata, value: "{{t:identity.pec}}"}

  - section: G2) Altri tecnici incaricati
    fields: []

  # Two firms on site: the second firm's block comes from "+". Fields by label inside the
  # block-th repeat that starts at "Ragione sociale".
  - section: h) Impresa esecutrice dei lavori
    leave: [Telefono, fax]
    firms: [f1, f2]
    fields:
      - {kind: radio, label: che i lavori sono/saranno eseguiti dalla impresa}
    block:
      - {kind: text, label: Ragione sociale, value: "{{F:business.denominazione}}"}
      - {kind: text, label: codice fiscale / p. IVA, value: "{{F:business.partita_iva}}"}
      - {kind: select, label: Iscritta alla C.C.I.A.A. di, value: "{{F:business.cciaa}}"}
      - {kind: text, label: n., nth: 1, value: "{{F:business.rea|rea_num}}"}
      - {kind: text, label: con sede in, value: "{{F:business.sede_legale_comune|upper}}"}
      - {kind: select, label: provincia, nth: 1, value: "{{F:business.sede_legale_provincia}}"}
      - {kind: text, label: "Via, Piazza", value: "{{F:business.sede_legale_indirizzo|upper}}"}
      - {kind: text, label: N., nth: 2, value: "{{F:business.sede_legale_civico}}"}
      - {kind: text, label: C.A.P., value: "{{F:business.sede_legale_cap}}"}
      - {kind: text, label: Cognome, value: "{{F:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{F:identity.first_name}}"}
      - {kind: text, label: codice fiscale, nth: 2, value: "{{F:identity.codice_fiscale}}"}
      - {kind: text, label: nato a, value: "{{F:identity.birth_comune|upper}}"}
      - {kind: select, label: provincia, nth: 2, value: "{{F:identity.birth_province}}"}
      - {kind: date, label: nato il, value: "{{F:identity.date_of_birth|date_it}}"}
      - {kind: text, label: cell., value: "{{F:identity.phone|phone_it}}"}
      - {kind: text, label: posta elettronica, value: "{{F:business.pec}}"}
      # DURC: each box opens its own rows (and renumbers what follows).
      - {kind: checkbox, label: INPS}
      - {kind: text, label: sede di, nth: 1, value: "{{F:business.sede_legale_comune|upper}}"}
      - {kind: text, label: Matr./Pos. Contr., value: "{{F:business.inps_matricola}}"}
      - {kind: checkbox, label: INAIL}
      - {kind: text, label: sede di, nth: 2, value: "{{F:business.inail_codice_sede}}"}
      - {kind: text, label: codice impresa, value: "{{F:business.inail_codice_ditta}}"}
      - {kind: text, label: pos. assicurativa, value: "{{F:business.inail_pat}}"}

  # Two firms, under 200 uomini-giorno: D.Lgs. 81 applies and the notifica preliminare,
  # already sent, is attached.
  - section: i) Rispetto degli obblighi
    fields:
      - {kind: radio, label: ricade nell'ambito di applicazione delle norme}
      - {kind: radio, label: dichiara che l'entità presunta del cantiere è inferiore}
      - {kind: radio, label: dichiara che l'intervento è soggetto all'invio}
      - {kind: checkbox, label: allega alla presente comunicazione la notifica}

  # The progettista's relazione (her asseverazione and signature are the signed CILA).
  - section: Relazione Tecnica di Asseverazione
    leave: [specificare il tipo di intervento, Comunicazioni, Autorità competente, Tipologia di atto, Note]
    fields:
      - {kind: text, label: Cognome, value: "{{t:identity.last_name}}"}
      - {kind: text, label: Nome, value: "{{t:identity.first_name}}"}
      - {kind: text, label: Iscritto all'ordine, value: "{{t:albo.ordine}}"}
      - {kind: text, label: di, value: "{{t:albo.provincia|provincia_nome}}"}
      - {kind: text, label: al n., value: "{{t:albo.numero}}"}
      - {kind: checkbox, label: interventi di manutenzione straordinaria}
      - {kind: textarea, label: e che consistono in, value: "{{ask.dettaglio_intervento}}"}
      - {kind: radio, label: "no"}

  # The fees, when the Comune's tariff has them. "pagamento on line" is required with them and
  # the only mode offered; it pays nothing (the SUE's payment page has no methods: the fees go
  # by bank transfer and their receipt is uploaded there).
  - section: Dichiarazione relativa ai diritti
    fields:
      - {kind: radio, label: non sono dovuti oneri, when: "{{ask.diritti_euro|positive|not}}"}
      - {kind: radio, label: poiché non previsti dal tariffario, when: "{{ask.diritti_euro|positive|not}}"}
      - {kind: radio, label: sono dovuti oneri quali diritti o spese, when: "{{ask.diritti_euro|positive}}"}
      - {kind: number, label: per un totale di Euro, value: "{{ask.diritti_euro}}", when: "{{ask.diritti_euro|positive}}"}
      - {kind: radio, label: pagamento on line, when: "{{ask.diritti_euro|positive}}"}

  # Fine lavori: the date, whole or in part, and the title the works were done under.
  - section: comunicazione di fine lavori
    fields:
      - {kind: date, label: che in data, value: "{{ask.data_fine_lavori|date_it}}"}
      - {kind: radio, label: completamente, when: "{{ask.fine_completa}}"}
      - {kind: radio, label: in forma parziale, when: "{{ask.fine_completa|not}}"}
      - {kind: text, label: che il titolo e/o comunicazione, value: "{{ask.titolo_edilizio}}"}
      - {kind: text, label: prot./n., value: "{{ask.titolo_protocollo}}"}
      - {kind: date, label: del, value: "{{ask.titolo_data|date_it}}"}

# The screens after the form, reached with their button. The attachments go by slot title; a
# slot the pratica's crawl doesn't list is left out, a required one nothing fills stops gen.py.
after:
  - section: Pagamento degli oneri
    go: Prosegui
    save: false
    fields: []

  # What a pratica adds of its own (the CILA's relazione tecnica in Allegati liberi) is in its
  # recipe's `attachments`. Not here, the person's: the portal's procura (download, the client signs, then .p7m), the
  # Quadro riepilogativo (the national checklist, to complete and sign), the fee receipt
  # (.p7m), the Allegato A and the Modello DP (signed).
  - section: Gestione degli allegati
    go: Prosegui
    theirs: [Procura speciale, Quadro riepilogativo della documentazione]
    fields:
      - {kind: file, label: "Fotocopia di un documento di identita' del soggetto che conferisce", value: "{{ask.documento_identita_cliente}}"}
      - {kind: file, label: "Copia dei documenti d'identità del/i titolare/i", value: "{{ask.documento_identita_cliente}}"}
      - {kind: file, label: Dichiarazione di assenso dei terzi titolari, value: "{{ask.assenso_proprietario}}"}
      - {kind: file, label: Notifica preliminare, value: "{{ask.notifica_preliminare}}"}
      - {kind: file, label: Elaborati grafici dello stato di fatto e progetto, value: "{{ask.elaborati_grafici}}"}
